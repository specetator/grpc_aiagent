syntax = "proto3";

package sparkpush;

// 通用错误信息
message ErrorInfo {
  int32 code = 1;      // 0 表示成功，非 0 代表错误码
  string message = 2;  // 具体错误原因
}

// 基础消息模型（内部存储/序列化使用）
message ChatMessage {
  string msg_id = 1;          // 服务端生成的唯一ID，格式: msgid:1:2-123，其中123是严格递增序号
  string session_id = 2;       // 会话ID
  int64 msg_seq = 3;           // 从msg_id提取的序号，用于排序和未读计数（服务端填充）
  int64 sender_id = 4;         // 发送方用户ID
  int64 timestamp_ms = 5;      // 消息时间戳（毫秒）
  string msg_type = 6;         // 消息类型: text / image / system ...
  string content_json = 7;     // 消息内容JSON
  string client_msg_id = 8;    // 客户端生成的ID，用于ACK匹配（可选）
}

// 消息确认（ACK）请求
message AckMessageRequest {
  int64 user_id = 1;       // 确认方用户ID
  int64 msg_seq = 2;       // 确认的消息序号（从msg_id提取的seq）
  string session_id = 3;   // 会话ID
}

message AckMessageReply {
  ErrorInfo error = 1;
}

// ========== LogicService 相关 ==========

// comet -> logic：鉴权
message VerifyTokenRequest {
  string token = 1;
  string comet_id = 2;
  string conn_id = 3;   // 新增：连接唯一标识，便于绑定与审计
}

message VerifyTokenReply {
  ErrorInfo error = 1;
  int64 user_id = 2;
}

// comet -> logic：上行单聊消息
message UpstreamMessageRequest {
  int64 from_user_id = 1;
  string client_msg_id = 2;    // 客户端消息ID（可选，用于ACK匹配）
  string content_json = 3;     // 消息内容JSON
  string comet_id = 4;         // 来源 comet 节点
  string conn_id = 5;          // 来源连接 ID
  int64 received_time_ms = 6;  // Comet 收到时间（毫秒）
  string msg_type = 7;         // 客户端上报的消息类型
  string target_type = 8;      // single_chat / room 等
  int64 target_id = 9;         // 目标 ID（单聊为对端 uid，群聊为 room_id）
}

message UpstreamMessageReply {
  ErrorInfo error = 1;
  ChatMessage message = 2;
}

// comet -> logic：用户下线
message UserOfflineRequest {
  int64 user_id = 1;
  string comet_id = 2;
  string conn_id = 3;   // 连接 ID，便于精确清理路由
}

message SimpleReply {
  ErrorInfo error = 1;
}

service LogicService {
  rpc VerifyToken(VerifyTokenRequest) returns (VerifyTokenReply);
  rpc SendUpstreamMessage(UpstreamMessageRequest) returns (UpstreamMessageReply);
  rpc UserOffline(UserOfflineRequest) returns (SimpleReply);
}

// ========== JobService / CometService 相关 ==========

// logic -> job -> comet：按 comet fanout 的下行消息目标
message FanoutTarget {
  int64 user_id = 1;
  string comet_id = 2;  // 可选：精确到连接所在 comet
}

message PushToCometRequest {
  repeated string comet_ids = 1;  // 需要推送的 comet 列表；为空时 job 侧可广播兜底
  ChatMessage message = 2;
  int64 room_id = 3;                  // 房间广播使用；单聊可为 0
  repeated FanoutTarget targets = 4;  // 单聊/定向推送使用；房间可为空
}

message PushToCometReply {
  ErrorInfo error = 1;
}

service JobService {
  rpc EnqueuePushTask(PushToCometRequest) returns (SimpleReply);
}

service CometService {
  rpc PushToComet(PushToCometRequest) returns (PushToCometReply);
}
