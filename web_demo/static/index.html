<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spark Push · 协作空间</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link rel="stylesheet" href="auth_style.css">
  <style>
    body {
      font-family: var(--font-sans);
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      background: var(--bg-color);
      color: var(--text-color);
      overflow: hidden;
    }

    /* --- 侧边栏区域 (Claude Minimal Warm Sidebar) --- */
    #sidebar {
      width: 320px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 10;
      box-shadow: 1px 0 0 rgba(0, 0, 0, 0.02);
    }

    .sidebar-header {
      padding: 22px 22px 18px;
      border-bottom: 1px solid var(--border-color);
      background: transparent;
    }
    .sidebar-header h2 {
      margin: 0;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      color: var(--primary-color);
      background: var(--primary-light);
      border: 1px solid var(--primary-border);
      font-size: 16px;
    }
    .sidebar-subtitle {
      font-size: 11.5px;
      color: var(--muted-color);
      margin-top: 6px;
      letter-spacing: 0.01em;
    }

    /* 登录面板 */
    #auth-panel {
      padding: 24px 22px;
      flex: 1;
      overflow-y: auto;
    }
    .auth-intro { margin: 2px 0 20px; }
    .auth-intro .eyebrow {
      color: var(--primary-color);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .auth-intro h3 {
      margin: 6px 0 5px;
      font-size: 22px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.025em;
    }
    .auth-intro p {
      margin: 0;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.55;
    }

    .quick-links {
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid var(--border-color);
    }
    .quick-links-title {
      margin-bottom: 10px;
      color: var(--muted-color);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .quick-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      margin: 4px 0;
      color: var(--text-color) !important;
      text-decoration: none;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      background: transparent;
      transition: all 0.16s ease;
    }
    .quick-link:hover {
      background: var(--surface-color);
      border-color: var(--border-color);
      transform: translateX(2px);
      box-shadow: var(--shadow-subtle);
    }
    .quick-link.admin {
      color: var(--primary-color) !important;
      background: var(--primary-light);
      border-color: var(--primary-border);
    }
    .quick-icon { width: 22px; text-align: center; font-size: 15px; }
    .quick-link-label { flex: 1; font-size: 13px; font-weight: 500; }
    .quick-arrow { color: var(--muted-color); font-size: 15px; }
    .demo-note {
      margin-top: 14px;
      padding: 10px 12px;
      color: var(--text-secondary);
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 11.5px;
      line-height: 1.55;
    }

    /* 登录后面板 (导航与会话) */
    #nav-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .nav-search-box {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      background: var(--surface-color);
    }
    .tip-banner {
      font-size: 11.5px;
      color: var(--tip-text, #92400e);
      background: var(--tip-bg, #fefce8);
      border: 1px solid var(--tip-border, #fef08a);
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
      line-height: 1.45;
    }
    .hermes-trigger-btn {
      width: 100%;
      margin-top: 8px;
      padding: 8px 10px;
      border: 1px solid var(--primary-border);
      border-radius: var(--radius-md);
      background: var(--primary-light);
      color: var(--primary-hover);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.16s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-sizing: border-box;
    }
    .hermes-trigger-btn:hover {
      background: var(--primary-light-active, #f5dfd6);
      border-color: var(--primary-border-strong, #e5b3a1);
    }

    .session-list-header {
      padding: 12px 16px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .session-list-header span {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted-color);
    }
    .refresh-link {
      background: none;
      border: none;
      color: var(--primary-color);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: var(--radius-sm);
    }
    .refresh-link:hover {
      background: var(--primary-light);
    }

    /* 会话列表容器 */
    .session-list-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }
    .session-item {
      padding: 11px 13px;
      margin-bottom: 6px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .session-item:hover {
      background: var(--surface-color);
      border-color: var(--border-subtle);
    }
    .session-item.active {
      background: var(--surface-color);
      border-color: var(--border-color);
      box-shadow: var(--shadow-subtle);
    }
    .avatar-placeholder {
      width: 36px;
      height: 36px;
      background: var(--accent-sand);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
      border: 1px solid var(--border-color);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 2px;
      user-select: none;
    }
    .session-item.active .avatar-placeholder {
      background: var(--primary-light);
      color: var(--primary-color);
      border-color: var(--primary-border);
    }
    .session-info {
      flex: 1;
      overflow: hidden;
    }
    .session-name {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 2px;
    }
    .session-preview {
      font-size: 12px;
      color: var(--muted-color);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 用户信息条 (底栏) */
    .user-profile-bar {
      padding: 14px 16px;
      background: var(--surface-color);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .user-info {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .user-id-badge {
      font-size: 11px;
      color: var(--muted-color);
      font-family: var(--font-mono);
    }
    .logout-btn {
      font-size: 12px;
      color: var(--status-error);
      cursor: pointer;
      background: none;
      border: 1px solid transparent;
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      transition: all 0.16s ease;
    }
    .logout-btn:hover {
      background: var(--status-error-bg);
      border-color: rgba(194, 65, 12, 0.2);
    }

    /* --- 主聊天区域 (Claude Warm Minimal Stage) --- */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-color);
      position: relative;
    }

    /* 空状态 (Empty State) */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted-color);
      background: radial-gradient(circle at 50% 40%, var(--empty-glow, rgba(201, 100, 66, 0.04)), transparent 45%), var(--bg-color);
    }
    #empty-state .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.9;
    }
    #empty-state h3 {
      color: var(--text-primary);
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    #empty-state p {
      color: var(--text-secondary);
      font-size: 13.5px;
      margin: 0;
    }

    /* 聊天窗口 */
    #chat-window {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .chat-header {
      height: 64px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 26px;
      background: var(--surface-color);
    }
    .chat-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.015em;
    }
    .chat-session-badge {
      font-size: 11px;
      color: var(--muted-color);
      font-family: var(--font-mono);
      margin-top: 2px;
    }
    .chat-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chat-actions button {
      border: 1px solid var(--border-color);
      background: var(--surface-color);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 12.5px;
      color: var(--text-secondary);
      font-weight: 500;
      transition: all 0.16s ease;
    }
    .chat-actions button:hover {
      background: var(--bg-color);
      color: var(--text-primary);
      border-color: var(--border-strong, #d1cfc7);
    }

    /* 消息流区域 */
    #messages {
      flex: 1;
      padding: 26px 32px;
      overflow-y: auto;
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg-row {
      display: flex;
      gap: 12px;
      max-width: 76%;
      align-items: flex-start;
      content-visibility: auto;
      contain-intrinsic-size: auto 88px;
    }
    .msg-row.me {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .msg-row.other {
      align-self: flex-start;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent-sand);
      border: 1px solid var(--border-color);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .msg-row.me .msg-avatar {
      background: var(--primary-light);
      color: var(--primary-color);
      border-color: var(--primary-border);
    }

    .msg-content-wrapper {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .msg-name {
      font-size: 11.5px;
      color: var(--muted-color);
      margin-bottom: 5px;
      font-weight: 500;
    }
    .msg-row.me .msg-name {
      text-align: right;
    }
    .session-preview.task-active {
      color: var(--primary, #7c3aed);
      font-weight: 600;
    }
    .msg-bubble {
      padding: 12px 16px;
      border-radius: var(--radius-lg);
      font-size: 14px;
      line-height: 1.6;
      word-wrap: break-word;
      position: relative;
      box-shadow: var(--shadow-subtle);
    }
    .msg-row.me .msg-bubble {
      background: var(--bubble-me);
      color: var(--bubble-me-text);
      border: 1px solid var(--bubble-me-border);
      border-top-right-radius: 4px;
    }
    .msg-row.other .msg-bubble {
      background: var(--bubble-other);
      color: var(--bubble-other-text);
      border: 1px solid var(--bubble-other-border);
      border-top-left-radius: 4px;
    }

    .msg-status {
      margin-top: 4px;
      color: var(--muted-color);
      font-size: 11px;
      text-align: right;
      font-family: var(--font-mono);
    }
    .msg-row.other .msg-status {
      text-align: left;
    }

    /* Claude / Hermes Markdown 样式 */
    .msg-bubble[data-safe-markdown-version] {
      white-space: normal;
      line-height: 1.65;
    }
    .msg-bubble[data-safe-markdown-version] p {
      margin: 0 0 10px;
    }
    .msg-bubble[data-safe-markdown-version] p:last-child {
      margin-bottom: 0;
    }
    .msg-bubble[data-safe-markdown-version] h1,
    .msg-bubble[data-safe-markdown-version] h2,
    .msg-bubble[data-safe-markdown-version] h3,
    .msg-bubble[data-safe-markdown-version] h4 {
      margin: 14px 0 8px;
      font-size: 1.05em;
      font-weight: 600;
      color: var(--text-primary);
    }
    .msg-bubble[data-safe-markdown-version] a {
      color: var(--primary-color);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .msg-bubble[data-safe-markdown-version] code {
      background: var(--code-inline-bg, rgba(34, 30, 20, 0.06));
      font-family: var(--font-mono);
      font-size: 12.5px;
      padding: 2px 5px;
      border-radius: var(--radius-sm);
      color: var(--text-primary);
    }
    .msg-bubble[data-safe-markdown-version] pre {
      overflow: auto;
      background: var(--code-block-bg, #1f1e1d);
      color: var(--code-block-text, #edece6);
      padding: 14px 16px;
      border-radius: var(--radius-md);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.55;
      margin: 10px 0;
    }
    .msg-bubble[data-safe-markdown-version] pre code {
      background: transparent;
      padding: 0;
      color: inherit;
      border-radius: 0;
    }

    /* Hermes 流式打字与思考 */
    .msg-row.hermes-streaming .msg-bubble::after {
      content: '▌';
      margin-left: 2px;
      color: var(--primary-color);
      animation: hermes-caret 0.9s steps(1) infinite;
    }
    .msg-row.hermes-thinking .msg-bubble {
      color: var(--text-secondary);
      font-style: italic;
    }
    .msg-row.hermes-thinking .msg-bubble::before {
      content: '•••';
      display: inline-block;
      margin-right: 7px;
      letter-spacing: 3px;
      color: var(--primary-color);
      animation: hermes-thinking 1.1s ease-in-out infinite;
    }
    @keyframes hermes-thinking {
      0%, 100% { opacity: 0.35; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-1px); }
    }
    @keyframes hermes-caret {
      50% { opacity: 0; }
    }

    /* 系统消息 */
    .msg-system {
      align-self: center;
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      font-size: 12px;
      padding: 5px 14px;
      border-radius: 999px;
      margin: 12px 0;
      box-shadow: var(--shadow-subtle);
    }

    /* 输入栏 */
    #input-area {
      padding: 16px 24px;
      background: var(--surface-color);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      align-items: center;
    }
    #msg-text {
      flex: 1;
      padding: 11px 16px;
      border: 1px solid var(--border-color);
      background: var(--surface-subtle);
      border-radius: var(--radius-md);
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
      transition: all 0.18s ease;
    }
    #msg-text:focus {
      background: var(--surface-color);
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px var(--focus-ring, rgba(201, 100, 66, 0.14));
    }
    #send-btn {
      padding: 0 24px;
      height: 42px;
      background: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: -0.01em;
      box-shadow: var(--primary-shadow-sm, 0 1px 3px rgba(201, 100, 66, 0.25));
      transition: all 0.18s ease;
    }
    #send-btn:hover {
      background: var(--primary-hover);
      box-shadow: var(--primary-shadow-md, 0 4px 10px rgba(201, 100, 66, 0.32));
    }
    #attach-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border-color);
      background: var(--surface-subtle);
      color: var(--text-primary);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 18px;
    }
    #pending-images {
      display: none;
      gap: 8px;
      padding: 0 24px 10px;
      background: var(--surface-color);
      flex-wrap: wrap;
    }
    #pending-images.visible { display: flex; }
    .pending-thumb {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .pending-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .pending-thumb button {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 18px;
      height: 18px;
      border: 0;
      border-radius: 999px;
      background: rgba(0,0,0,0.65);
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      line-height: 18px;
    }
    .msg-image {
      display: block;
      max-width: 280px;
      max-height: 220px;
      border-radius: 10px;
      margin-top: 8px;
      object-fit: contain;
      background: var(--surface-subtle);
    }

    /* Toast 提示 */
    #toast-container {
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      background: var(--toast-bg, #1f1e1d);
      color: var(--toast-text, #edece6);
      padding: 10px 20px;
      border-radius: var(--radius-md);
      font-size: 13.5px;
      box-shadow: var(--shadow-dropdown);
      animation: toast-in 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      border: 1px solid var(--toast-border, rgba(255, 255, 255, 0.08));
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes toast-out {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-16px); }
    }

    /* 回到最新悬浮按钮 */
    #back-to-latest {
      position: absolute;
      right: 28px;
      bottom: 92px;
      z-index: 20;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--surface-color);
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: var(--shadow-dropdown);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease, color 0.16s ease;
    }
    #back-to-latest.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    #back-to-latest:hover {
      color: var(--primary-color);
      border-color: var(--primary-border);
    }

    @media (max-width: 760px) {
      body { height: auto; min-height: 100vh; overflow: auto; flex-direction: column; }
      #sidebar { width: 100%; border-right: 0; border-bottom: 1px solid var(--border-color); }
      #auth-panel { padding: 20px; }
      #nav-panel { min-height: 340px; }
      #main { min-height: 540px; }
      #messages { padding: 18px 16px; }
      .msg-row { max-width: 88%; }
      .chat-header { padding: 0 16px; }
      #input-area { padding: 12px 16px; }
    }
  </style>
  <script src="runtime-config.js"></script>
  <script src="endpoints.js"></script>
  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="themes.css">
  <script src="safe_markdown.js"></script>
  <script src="agent_channel.js"></script>
  <script src="agent_connections.js"></script>
  <link rel="stylesheet" href="agent_connections.css">
  <link rel="stylesheet" href="agent_channel.css">
  <script src="spaces.js"></script>
  <script src="room_agents.js"></script>
  <script src="room_agent_channel.js"></script>
  <script src="collaboration_ui.js"></script>
  <link rel="stylesheet" href="collaboration_ui.css">
</head>
<body>
  <div id="toast-container"></div>
  <!-- 左侧侧边栏 -->
  <div id="sidebar">
    <div class="sidebar-header">
      <h2><span class="brand-icon">⚡</span> Spark Push</h2>

    <!-- 2. 已登录状态：显示会话列表 + 底部个人信息 -->
    <div id="nav-panel" class="hidden">
      <!-- 搜索/新建会话区域 -->
      <div class="nav-search-box">
        <div style="display:flex; gap:6px;">
          <input id="to-user" class="form-control" placeholder="对方完整账号" aria-label="私聊账号" />

  <!-- 右侧主区域 -->
  <div id="main">
    <div class="connection-bar"><button id="sidebar-toggle" type="button" aria-label="打开会话列表">☰</button><span id="connection-status" role="status">尚未登录</span><button id="reconnect-btn" type="button" hidden>重新连接</button></div>
    <!-- 状态 A: 未选择会话 -->
    <div id="empty-state">
      <div class="empty-icon">✦</div>
      <h3>给想法一个共同的空间</h3>

    <!-- 状态 B: 聊天窗口 -->
    <div id="chat-window" class="hidden">
      <div class="chat-header">
        <div class="flex-col">
           <span class="chat-title" id="chat-title">与 User ... 聊天中</span>
           <span class="chat-session-badge" id="conversation-subtitle">私聊</span><span id="session-id-disp" hidden></span>

        <div class="chat-actions">
          <span style="font-size:12px; margin-right:6px; color:var(--muted-color);">未读: <span id="unread-count" style="font-weight:600; color:var(--primary-color);">0</span></span>

        <!-- 消息会动态插入这里 -->
      </div>

        <input id="image-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden />

        <input id="msg-text" placeholder="输入消息... (Enter 发送，可粘贴截图)" />
        <button id="agent-commands-btn" type="button" title="Agent 常用命令" aria-label="Agent 常用命令">/ 命令</button>

    <button id="back-to-latest" type="button">↓ 回到最新</button>
  </div>

  <script>
    // 全局变量
    let ws = null;
    let currentUserId = null;
    let currentUserName = '';
    let token = null;
    let currentSessionId = null; // 当前选中的会话ID
    let currentPeerId = null;    // 当前聊天的对象ID
    let currentConversation = null;
    let collaboration = null;
    let authEpoch = 0;
    let loginRequest=0;
    const contactNames = new Map();
    const revokedRooms = new Set();
    const roomAccessEpoch = new Map();
    const sentMessages = new Map();
    let uploadingMessage=false;
    let uploadController=null;
    const hermesBotUserId = 900000000001;
    const agentContacts = new Map([[hermesBotUserId, 'Kernel Agent'], [900000000101, 'Hermes · technical']]);
    ['DeepSeek Harness', 'Codex', 'Claude Code', 'Hermes', 'OpenClaw'].forEach((name, i) =>
      agentContacts.set(900000000301 + i, '我的 ' + name));
    const conversationDrafts = new Map();
    const sessionWorkspaces = new Map();
    const isAgentPeer = id => agentContacts.has(Number(id));
    const agentName = id => agentContacts.get(Number(id)) || 'AI Agent';
    let lastHistorySeq = 0;      // 历史消息最大seq，用于标记已读
    // 单聊历史分页状态
    let historyAnchorSeq = 0;    // 当前已加载历史中最早一条的 msg_seq
    let historyHasMore = true;   // 是否还有更多历史
    let historyLoading = false;  // 是否正在加载
    let historyReady = false;    // 首屏历史未完成前，实时消息先排队，避免顺序颠倒
    let historyRequestController = null;
    let pendingLiveMessages = [];
    // 实时连接游标：收到乱序/跳号消息时按 session_id 请求缺口补偿。
    const sessionCursors = Object.create(null);
    const seenSessionSequences = Object.create(null);
    const pendingCursorSync = new Set();
    const cursorSyncStarted = new Map();
    let pendingConversationDiscovery=null;
    // 历史、实时和乐观消息共用一套身份索引，避免同一条消息被渲染两次。
    // key 可能是服务端 msg_id，也可能是客户端 client_msg_id；两者都登记。
    const renderedMessageRows = new Map();
    const agentModelActions = new Map();
    const agentModelResults = new Map();
    let agentModelActionOrder = 0;
    const messageDeliveryStates = new Map();
    let chatViewGeneration = 0;
    // Hermes 增量只在当前窗口展示，最终 single_chat 消息到达后替换它；
    // 增量没有 msg_seq，不参与历史游标和缺口补偿。
    const hermesStreamStates = new Map();
    const hermesCompletedRequests = new Set();
    let reconnectTimer = null;
    let reconnectAttempt = 0;
    let wsGeneration = 0;
    let wasConnected = false;
    let authValidationInFlight = null;
    let sessionListRequestId = 0;
    let currentAuthMode = 'login';

    // 配置
    const logicBase = window.SparkEndpoints?.apiBase ?? (location.protocol + '//' + location.hostname + ':9101');
    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const cometWsUrl = window.SparkEndpoints?.websocket ?? (wsProtocol + '//' + location.hostname + ':9000/ws');

    async function clientApi(path,body) {
      const epoch=authEpoch,credential=token,room=Number(body.room_id||0),access=roomAccessEpoch.get(room)||0;
      const response=await fetch(logicBase+path,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+credential},body:JSON.stringify(body)});
      const result=await response.json();
      if(epoch!==authEpoch || credential!==token || access!==(roomAccessEpoch.get(room)||0))throw Object.assign(new Error('操作所属会话已结束'),{code:499});
      if(result.code!==0){if(result.code===401)doLogout('登录已失效，请重新登录');throw Object.assign(new Error(result.message||'操作失败'),{code:result.code});}
      return result.data||{};
    }
    function setConnectionStatus(text,retry=false){document.getElementById('connection-status').textContent=text;document.getElementById('reconnect-btn').hidden=!retry;}
    function cancelPendingUpload(){const controller=uploadController;uploadController=null;uploadingMessage=false;controller?.abort();}
    function sendRoomPresence(type,room){if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type,group_id:Number(room)}));}
    function invalidateSpace(room){
      room=Number(room);const sid='r_'+room;revokedRooms.add(room);roomAccessEpoch.set(room,(roomAccessEpoch.get(room)||0)+1);
      sessionWorkspaces.delete(sid);conversationDrafts.delete(sid);conversationPendingImages.delete(sid);
      for(const key of sentMessages.keys())if(key.startsWith(sid+':'))sentMessages.delete(key);
      for(const key of messageDeliveryStates.keys())if(key.startsWith(sid+':'))messageDeliveryStates.delete(key);
      delete sessionCursors[sid];delete seenSessionSequences[sid];
      for(const key of attachmentObjectUrls.keys())if(key.startsWith(sid+':'))attachmentObjectUrls.delete(key);
      clearCursorSync(sid);
      if(currentSessionId===sid){
        cancelPendingUpload();
        ++chatViewGeneration;historyRequestController?.abort();sendRoomPresence('chatroom_leave',room);
        currentSessionId=null;currentPeerId=null;currentConversation=null;pendingLiveMessages=[];
        renderedMessageRows.clear();hermesStreamStates.clear();hermesCompletedRequests.clear();pendingImages=[];renderPendingImages();
        document.getElementById('messages').replaceChildren();document.getElementById('msg-text').value='';
        document.getElementById('chat-window').classList.add('hidden');document.getElementById('empty-state').classList.remove('hidden');
        collaboration?.opened(null);collaboration?.togglePanel(false);
      }
      collaboration?.refresh();
    }

    // --- 界面切换逻辑 ---
    function updateUIState() {
      const authPanel = document.getElementById('auth-panel');
      const navPanel = document.getElementById('nav-panel');
      const emptyState = document.getElementById('empty-state');
      const chatWindow = document.getElementById('chat-window');

      if (currentUserId) {
        // 已登录
        authPanel.classList.add('hidden');
        navPanel.classList.remove('hidden');
        document.getElementById('my-user-name').textContent = currentUserName || '我';
        loadSingleSessionList(); // 自动刷新列表
        collaboration?.refresh();
      } else {
        // 未登录
        authPanel.classList.remove('hidden');
        navPanel.classList.add('hidden');
        emptyState.classList.remove('hidden');
        chatWindow.classList.add('hidden');
      }
    }

    function doLogout(statusMessage) {
      ++authEpoch;++sessionListRequestId;
      cancelPendingUpload();
      pendingConversationDiscovery?.controller.abort();pendingConversationDiscovery=null;
      Auth.clear(); // 清除本地缓存
      // 先让旧连接回调失效，再关闭连接，避免 onclose 再次安排重连。
      ++wsGeneration;
      if (ws) {
        ws.onclose = null;
        ws.close();
      }
      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }
      if (historyRequestController) historyRequestController.abort();
      ++chatViewGeneration;
      currentUserId = null;
      currentUserName = '';
      token = null;
      currentSessionId = null;
      currentPeerId = null;
      currentConversation = null;
      ws = null;
      wasConnected = false;
      reconnectAttempt = 0;
      pendingCursorSync.clear();
      cursorSyncStarted.clear();
      document.getElementById('messages').innerHTML = '';
      renderedMessageRows.clear();
      agentModelActions.clear(); agentModelResults.clear();
      messageDeliveryStates.clear();
      hermesStreamStates.clear();
      hermesCompletedRequests.clear();sessionWorkspaces.clear();conversationDrafts.clear();sentMessages.clear();
      conversationPendingImages.clear();attachmentObjectUrls.clear();contactNames.clear();revokedRooms.clear();
      for(const key of Object.keys(sessionCursors))delete sessionCursors[key];
      for(const key of Object.keys(seenSessionSequences))delete seenSessionSequences[key];
      pendingImages=[];renderPendingImages();document.getElementById('msg-text').value='';
      collaboration?.reset();setConnectionStatus('尚未登录');
      pendingLiveMessages = [];
      historyReady = false;
      document.getElementById('login-status').textContent = statusMessage || '';
      updateUIState();
    }

    // Redis 重启、管理员撤销 Token 或 Token 过期后，旧版本前端会一直拿着
    // 无效凭证重连，用户只能手动清理 localStorage。启动时先用一个受保护的
    // HTTP API 校验本地会话；连接过程中连续握手失败也走同一条路径。
    async function validateSavedSession(savedSession) {
      if (authValidationInFlight) return authValidationInFlight;

      const epoch=authEpoch;
      authValidationInFlight = (async () => {
        const userId = Number(savedSession && savedSession.user_id);
        const savedToken = savedSession && savedSession.token;
        if (!Number.isSafeInteger(userId) || userId <= 0 || !savedToken) {
          doLogout('本地登录状态无效，请重新登录');
          return false;
        }

        try {
          const resp = await fetch(logicBase + '/api/session/list_single', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + savedToken
            },
            body: JSON.stringify({ user_id: userId })
          });
          let data = null;
          try { data = await resp.json(); } catch (_) {}
          if(epoch!==authEpoch)return false;

          if (!resp.ok || !data || data.code !== 0) {
            const authFailed = resp.status === 401 || resp.status === 403 ||
              (data && /token|登录|disabled|deleted|失效|expired/i.test(data.message || ''));
            if (authFailed) {
              doLogout('登录状态已失效，请重新登录');
              return false;
            }
            document.getElementById('login-status').textContent =
              '服务器暂时不可达，已保留登录状态。可稍后重试。';
            currentUserId = userId;
            currentUserName = savedSession.name || ('用户 ' + userId);
            token = savedToken;
            updateUIState();
            return false;
          }

          currentUserId = userId;
          currentUserName = savedSession.name || ('用户 ' + userId);
          token = savedToken;
          reconnectAttempt = 0;
          connectWebSocket();
          updateUIState();
          return true;
        } catch (e) {
          if(epoch!==authEpoch)return false;
          document.getElementById('login-status').textContent =
            '无法连接 Logic 服务，已保留登录状态。请确认服务已启动后刷新或重试。';
          currentUserId = userId;
          currentUserName = savedSession.name || ('用户 ' + userId);
          token = savedToken;
          updateUIState();
          return false;
        }
      })();

      try {
        return await authValidationInFlight;
      } finally {
        authValidationInFlight = null;
      }
    }

    function workspaceFor(sessionId) {
      const key = String(sessionId || '');
      if (!key) return null;
      if (!sessionWorkspaces.has(key)) {
        sessionWorkspaces.set(key, {
          fragment: document.createDocumentFragment(),
          scrollTop: 0,
          streams: new Map(),
          completed: new Set(),
          rendered: new Map(),
          historyAnchorSeq: 0,
          historyHasMore: true,
          historyReady: false,
          lastHistorySeq: 0,
          task: { state: 'idle', text: '' }
          ,pending: [], bufferStart: null, recoveryFrom: null
        });
      }
      return sessionWorkspaces.get(key);
    }

    function parkCurrentWorkspace() {
      if (!currentSessionId) return;
      const ws = workspaceFor(currentSessionId);
      const container = document.getElementById('messages');
      ws.scrollTop = container.scrollTop;
      while (container.firstChild) ws.fragment.appendChild(container.firstChild);
      ws.streams = new Map(hermesStreamStates);
      ws.completed = new Set(hermesCompletedRequests);
      ws.rendered = new Map(renderedMessageRows);
      ws.historyAnchorSeq = historyAnchorSeq;
      ws.historyHasMore = historyHasMore;
      ws.historyReady = historyReady;
      ws.lastHistorySeq = lastHistorySeq;
    }

    function restoreWorkspace(sessionId) {
      const ws = workspaceFor(sessionId);
      const container = document.getElementById('messages');
      container.innerHTML = '';
      container.appendChild(ws.fragment);
      container.scrollTop = ws.scrollTop;
      hermesStreamStates.clear();
      ws.streams.forEach((value, key) => hermesStreamStates.set(key, value));
      hermesCompletedRequests.clear();
      ws.completed.forEach(value => hermesCompletedRequests.add(value));
      renderedMessageRows.clear();
      ws.rendered.forEach((value, key) => renderedMessageRows.set(key, value));
      historyAnchorSeq = ws.historyAnchorSeq;
      historyHasMore = ws.historyHasMore;
      historyReady = ws.historyReady;
      lastHistorySeq = ws.lastHistorySeq;
    }

    function setSessionTask(sessionId, state, text) {
      const ws = workspaceFor(sessionId);
      if (!ws) return;
      ws.task = { state: state || 'idle', text: text || '' };
      const item = document.querySelector('.session-item[data-sid="' + sessionId + '"] .session-preview');
      if (!item) return;
      item.classList.toggle('task-active', state && state !== 'idle' && state !== 'completed');
      if (state && state !== 'idle') item.textContent = text || state;
    }

    function showChatWindow(peerId, sessionId, descriptor) {
      cancelPendingUpload();
      const previous=currentConversation;
      if (currentSessionId) {
        conversationDrafts.set(String(currentSessionId), document.getElementById('msg-text').value);
        conversationPendingImages.set(String(currentSessionId), pendingImages.slice());
      }
      document.getElementById('msg-text').value = conversationDrafts.get(String(sessionId)) || '';
      pendingImages = conversationPendingImages.get(String(sessionId)) || [];
      renderPendingImages();
      parkCurrentWorkspace();
      const existing = sessionWorkspaces.get(String(sessionId));
      const viewGeneration = ++chatViewGeneration;
      currentPeerId = peerId;
      currentSessionId = sessionId;
      currentConversation=descriptor||{kind:'single',session_id:sessionId,name:isAgentPeer(peerId)?agentName(peerId):(contactNames.get(Number(peerId))||'私聊'),peer_user_id:peerId};
      if(currentConversation.kind==='room')revokedRooms.delete(Number(currentConversation.room_id));
      if(previous?.kind==='room' && previous.session_id!==sessionId)sendRoomPresence('chatroom_leave',previous.room_id);
      if (historyRequestController) historyRequestController.abort();
      pendingLiveMessages = workspaceFor(sessionId).pending;

      document.getElementById('empty-state').classList.add('hidden');
      document.getElementById('chat-window').classList.remove('hidden');

      document.getElementById('chat-title').textContent = currentConversation.name;
      document.getElementById('conversation-subtitle').textContent=currentConversation.kind==='room'?(currentConversation.visibility==='private'?'私有协作空间':'公开协作空间'):(isAgentPeer(peerId)?'个人 Agent 会话':'私聊');
      document.getElementById('session-id-disp').textContent = sessionId;
      const messageInput = document.getElementById('msg-text');
      if (isAgentPeer(peerId)) {
        messageInput.placeholder = '与 '+agentName(peerId)+' 交流';
        messageInput.title = '/agent · /cann · /kb · /kb status · /new · /retry · /model · /help';
      } else {
        messageInput.placeholder = currentConversation.kind==='room'?'发送消息，输入 @ 选择 Agent':'输入消息... (Enter 发送)';
        messageInput.title = '';
      }

      restoreWorkspace(sessionId);
      collaboration?.opened(currentConversation);
      document.getElementById('agent-commands-btn').hidden=!isAgentPeer(peerId);
      document.body.classList.remove('show-navigation');
      if(currentConversation.kind==='room')sendRoomPresence('chatroom_join',currentConversation.room_id);
      historyLoading = false;
      if (!existing || !existing.historyReady || existing.retryHistory) {
        loadHistory(true, viewGeneration, sessionId);
      } else {
        historyReady = true;
        flushPendingLiveMessages();
        sendCursorSync(sessionId,sessionCursors[sessionId]||0);
      }

      // 刷新未读数
      refreshUnread();

      // 高亮左侧列表项
      document.querySelectorAll('.session-item').forEach(el => {
         if(el.dataset.sid === sessionId) el.classList.add('active');
         else el.classList.remove('active');
      });
    }

    // --- 消息渲染逻辑 ---
    function renderBubbleContent(bubble, text, format) {
      if (format === 'markdown' && window.SparkSafeMarkdown) {
        SparkSafeMarkdown.render(bubble, String(text || ''));
      } else {
        bubble.removeAttribute('data-safe-markdown-version');
        bubble.textContent = text;
      }
    }

    const attachmentObjectUrls = new Map();
    const conversationPendingImages = new Map();
    let pendingImages = [];

    function getMsgAttachments(obj) {
      const meta = getMsgContentMeta(obj);
      const list = Array.isArray(meta.attachments) ? meta.attachments : [];
      return list.filter(item => item && item.id).slice(0, 4);
    }

    function renderMessageImages(bubble, attachments) {
      bubble.querySelectorAll('img.msg-image').forEach(node => node.remove());
      (attachments || []).forEach(item => {
        const img = document.createElement('img');
        img.className = 'msg-image';
        img.alt = item.name || '图片';
        bubble.appendChild(img);
        loadAttachmentPreview(item.id, img);
      });
    }

    async function loadAttachmentPreview(id, img) {
      const epoch=authEpoch,sid=currentSessionId,room=Number(currentConversation?.room_id||0),access=roomAccessEpoch.get(room)||0,key=sid+':'+id;
      if (attachmentObjectUrls.has(key)) {
        img.src = attachmentObjectUrls.get(key);

      try {
        const resp = await fetch(logicBase + '/api/attachment/get', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',

          },
          body: JSON.stringify({ id })
        });
        const data = await resp.json();
        if(epoch!==authEpoch || access!==(roomAccessEpoch.get(room)||0))return;
        if (data.code !== 0 || !data.data || !data.data.data) return;
        const url = 'data:' + (data.data.mime || 'image/png') + ';base64,' + data.data.data;

    function fileToPending(file) {
      const generation=chatViewGeneration,epoch=authEpoch;
      if (!file || !file.type.startsWith('image/')) {
        showToast('只支持 jpeg/png/gif/webp 图片');
        return;
      }
      if (pendingImages.length >= 4) {
        showToast('一条消息最多 4 张图片');
        return;
      }
      if (file.size > 4 * 1024 * 1024) {
        showToast('图片不能超过 4 MiB');
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        if(generation!==chatViewGeneration||epoch!==authEpoch)return;
        const dataUrl = String(reader.result || '');
        const comma = dataUrl.indexOf(',');
        pendingImages.push({
          name: file.name || 'screenshot.png',
          mime: file.type,
          preview: dataUrl,
          data: comma >= 0 ? dataUrl.slice(comma + 1) : ''
        });
        renderPendingImages();
      };
      reader.readAsDataURL(file);
    }

    async function uploadPendingImages(sessionId=currentSessionId,images=pendingImages.slice(),credential=token,signal) {
      if (!images.length) return [];
      if (!sessionId) throw new Error('未选择会话');
      const uploaded = [];
      for (const item of images) {
        const resp = await fetch(logicBase + '/api/attachment/upload', {
          method: 'POST',
          signal,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + credential
          },
          body: JSON.stringify({
            session_id: sessionId,
            name: item.name,
            data: item.data
          })
        });
        const data = await resp.json();
        if (data.code !== 0 || !data.data || !data.data.id) {
          throw new Error(data.message || '图片上传失败');
        }
        uploaded.push({
          id: data.data.id,
          name: data.data.name,
          mime: data.data.mime,
          bytes: data.data.bytes
        });
      }
      return uploaded;
    }

    function messageIdentityKeys(message) {
      if (!message) return [];
      const keys = [];
      for (const value of [message.msg_id, message.client_msg_id]) {
        if (value === undefined || value === null) continue;
        const key = String(value);
        if (key && !keys.includes(key)) keys.push(key);
      }
      return keys;
    }

    function findRenderedMessageRow(message) {
      for (const key of messageIdentityKeys(message)) {
        const row = renderedMessageRows.get(key);
        if (row) return row;
      }
      return null;
    }

    function rememberRenderedMessage(message, row) {
      if (!row) return;
      for (const key of messageIdentityKeys(message)) {
        renderedMessageRows.set(key, row);
      }
      // 防止长时间打开页面导致索引无限增长；DOM 本身仍由当前会话控制。
      while (renderedMessageRows.size > 20000) {
        renderedMessageRows.delete(renderedMessageRows.keys().next().value);
      }
    }

    function messageStateKey(message) {
      return messageIdentityKeys(message)[0] || '';
    }

    function applyMessageDeliveryState(message, row) {
      if (!message || !row) return;
      let state = '';
      for (const key of messageIdentityKeys(message)) {
        const scoped=String(message.session_id||currentSessionId||'')+':'+key;
        if (messageDeliveryStates.has(scoped)) {
          state = messageDeliveryStates.get(scoped);
          break;
        }
      }
      const status = row.querySelector('.msg-status');
      if (status && state) status.textContent = state;
    }

    function setMessageDeliveryState(message, state) {
      if (!message || !state) return;
      const sid=String(message.session_id||currentSessionId||'');
      for (const key of messageIdentityKeys(message)) {
        messageDeliveryStates.set(sid+':'+key, state);
      }
      const rows=sid===currentSessionId?renderedMessageRows:sessionWorkspaces.get(sid)?.rendered;
      const row=messageIdentityKeys(message).map(key=>rows?.get(key)).find(Boolean);
      if (row) {
        const status = row.querySelector('.msg-status');
        if (status) status.textContent = state;
        if(state==='已接收'||state==='已送达')row.querySelector('.message-retry')?.remove();
      }
      if(state==='已接收'||state==='已送达')sentMessages.delete(sid+':'+message.client_msg_id);
    }

    function offerMessageRetry(record){
      if(!record || record.epoch!==authEpoch)return;const row=record.row;
      if(row.querySelector('.message-retry'))return;

      button.onclick=()=>{

        if(!ws||ws.readyState!==WebSocket.OPEN){showToast('连接恢复后可重试');return;}
        ws.send(JSON.stringify(record.payload));setMessageDeliveryState({...record.payload,session_id:record.sessionId},'正在确认');

    function renderMessageOnce(message, text, isMe, senderId, timeStr, options) {
      // A terminal result may arrive only through HTTP history after a restart.
      // Reuse and settle its temporary private-Agent row before deduplication.
      const sender=Number(message.sender_id??message.from_user_id),clientId=String(message.client_msg_id||'');
      if(String(message.session_id||'').startsWith('s_')&&isAgentPeer(sender)&&clientId.startsWith('hermes:')){
        const requestId=clientId.slice(7);hermesCompletedRequests.add(requestId);
        if(hermesCompletedRequests.size>10000)hermesCompletedRequests.delete(hermesCompletedRequests.values().next().value);
        const stream=hermesStreamStates.get(requestId);
        if(stream){stream.pendingText='';stream.row.classList.remove('hermes-streaming','hermes-thinking');stream.progressNode?.remove();rememberRenderedMessage(message,stream.row);hermesStreamStates.delete(requestId);}
      }
      const existing = findRenderedMessageRow(message);
      if (existing) {
        // 服务端消息到达时，用权威内容替换乐观气泡，并把 msg_id 也登记起来。
        updateExistingMessageRow(existing, text, isMe, senderId, timeStr, {
          ...(options || {}),
          attachments: (options && options.attachments) || getMsgAttachments(message)
        });
        rememberRenderedMessage(message, existing);
        applyMessageDeliveryState(message, existing);
        renderAgentPresentation(existing, message);
        orderMessageRow(existing,message);decorateSenderName(existing,message);decorateRoomMessage(existing,message);
        return existing;
      }
      const opts = options || {};
      const row = appendMsgRow(text, isMe, senderId, timeStr, {
        prepend: !!opts.prepend,
        keepScroll: !!opts.keepScroll,
        messageId: message && message.msg_id,
        clientMsgId: message && message.client_msg_id,
        messageSeq: message && message.msg_seq,
        optimistic: !!opts.optimistic,
        deferScroll: !!opts.deferScroll,
        statusText: opts.statusText || '',
        format: opts.format,
        attachments: opts.attachments || getMsgAttachments(message)
      });
      rememberRenderedMessage(message, row);
      applyMessageDeliveryState(message, row);
      renderAgentPresentation(row, message);
      orderMessageRow(row,message);decorateSenderName(row,message);decorateRoomMessage(row,message);
      return row;
    }

    function orderMessageRow(row,message){
      if(message.msg_id)row.dataset.messageId=String(message.msg_id);
      if(message.client_msg_id)row.dataset.clientMsgId=String(message.client_msg_id);
      const seq=Number(message.msg_seq||0);if(seq<=0)return;row.dataset.messageSeq=String(seq);
      const container=document.getElementById('messages');
      const next=[...container.children].find(other=>other!==row && other.classList.contains('msg-row') &&
        (Number(other.dataset.messageSeq||0)>seq || Number(other.dataset.messageSeq||0)<=0));
      if(next)container.insertBefore(row,next);else container.append(row);
      lastHistorySeq=Math.max(lastHistorySeq,seq);
    }
    function roomEnvelope(message){
      let outer={};try{outer=typeof message.content==='string'?JSON.parse(message.content):message.content||{};}catch(_){}
      const wrapped=outer.type==='chatroom' && outer.session_id===message.session_id && outer.content && typeof outer.content==='object';
      return {...(wrapped?outer:{}),...message,from_user_id:message.sender_id??message.from_user_id??(wrapped?outer.from_user_id:0)};
    }
    function decorateRoomMessage(row,message){
      row._sparkMessage=message;if(!String(message.session_id||'').startsWith('r_'))return;
      const envelope=roomEnvelope(message),agent=collaboration?.agents.identity(envelope);
      const cann=!envelope.agent_id && envelope.request_id && Number(envelope.from_user_id)===hermesBotUserId;
      if(!agent&&!cann)return;
      row.dataset.agentIdentity=agent?.agent_id||'cann';row.dataset.agentRequest=envelope.request_id||'';row.dataset.sourceMessage=envelope.source_msg_id||'';
      row.querySelector('.msg-avatar').textContent=agent?.runtime==='hermes_native'?'H':'π';
      row.querySelector('.msg-name').textContent=(agent?.name||'Kernel Agent')+' · '+(collaboration?.memberName(envelope.actor_user_id)||'成员')+' 发起';

      if(meta.format==='markdown')renderBubbleContent(row.querySelector('.msg-bubble'),getMsgText(message),'markdown');
      if(envelope.agent_status==='failed'||envelope.agent_status==='cancelled')row.querySelector('.msg-status').textContent=envelope.agent_status==='failed'?'执行失败 · 在协作详情中查看和恢复':'已取消';
      if(envelope.source_msg_id&&!row.querySelector('.source-message-link')){

        button.onclick=()=>{const source=[...document.querySelectorAll('#messages [data-message-id]')].find(node=>node.dataset.messageId===row.dataset.sourceMessage);if(source)source.scrollIntoView({block:'center',behavior:'smooth'});else showToast('提问在更早的历史消息中');};
        row.querySelector('.msg-content-wrapper').append(button);
      }
    }
    function decorateSenderName(row,message){
      const envelope=String(message.session_id||'').startsWith('r_')?roomEnvelope(message):message;
      const sender=Number(envelope.sender_id??envelope.from_user_id);
      if(isAgentPeer(sender)||envelope.agent_id)return;
      const name=sender===Number(currentUserId)?currentUserName:(String(message.session_id||'').startsWith('r_')?collaboration?.memberName(sender):contactNames.get(sender));

    function updateAgentModelCards() {
      const sid = String(currentSessionId || '');
      for (const card of document.querySelectorAll('#messages .agent-model-picker')) {
        if (!card.applyModelState || card.dataset.agentSession !== sid) continue;
        const candidates = [...agentModelActions.values()].filter(item =>
          item.session === sid && item.source === card.dataset.agentCard);
        candidates.sort((a, b) => b.seq - a.seq || b.order - a.order);
        const action = candidates[0];
        if (!action) continue;
        const result = agentModelResults.get(sid + ':' + action.clientId);
        if (!result) { card.applyModelState({pending: true}); continue; }
        const matches = action.kind === 'reset_model' || (result.model &&
          result.model.provider === action.provider && result.model.id === action.modelId);
        card.applyModelState({ok: result.ok === true && matches, model: result.model});
      }
    }

    function trackAgentModelMessage(message, sender, sessionId, meta) {
      const clientId = String(message.client_msg_id || '');
      const action = meta.agent_action;
      if (sender === Number(currentUserId) && clientId && action &&
          ['select_model', 'reset_model'].includes(action.kind) &&
          typeof action.source_card === 'string' && action.source_card.length <= 128 &&
          SparkAgentChannel.commandForAction(action) === meta.text) {
        const key = sessionId + ':' + clientId;
        const previous = agentModelActions.get(key);
        agentModelActions.set(key, {session: sessionId, clientId, source: action.source_card,
          kind: action.kind, provider: action.provider, modelId: action.modelId,
          seq: Number(message.msg_seq) > 0 ? Number(message.msg_seq) : Number.MAX_SAFE_INTEGER,
          order: previous ? previous.order : ++agentModelActionOrder});
      }
      const result = meta.agent_command_result;
      if (isAgentPeer(sender) && sender === Number(currentPeerId) &&
          sessionId === buildSingleSessionId(currentUserId, sender) && clientId.startsWith('hermes:') && result &&
          result.command === 'model' && typeof result.client_msg_id === 'string' &&
          result.client_msg_id.length > 0 && result.client_msg_id.length <= 128 &&
          typeof result.ok === 'boolean' && (!result.ok || SparkAgentChannel.validModel(result.model))) {
        agentModelResults.set(sessionId + ':' + result.client_msg_id, result);
      }
      for (const map of [agentModelActions, agentModelResults])
        if (map.size > 2000) map.delete(map.keys().next().value);
      updateAgentModelCards();
    }

    function renderAgentPresentation(row, message) {
      const sender = Number(message.sender_id === undefined ? message.from_user_id : message.sender_id);
      const sessionId = String(message.session_id || '');
      const meta = getMsgContentMeta(message);
      trackAgentModelMessage(message, sender, sessionId, meta);
      if (!isAgentPeer(sender) || !String(message.client_msg_id || '').startsWith('hermes:')) return;
      const event = meta.agent_event;
      const sourceCard = String(message.msg_id || message.client_msg_id || '');
      for (const item of event?.data?.presentation?.actions || []) {
        if (item.id === 'agent_open' && SparkAgentChannel.validAgentContact(item.value))
          agentContacts.set(Number(item.value), item.label);
      }
      SparkAgentChannel.render(row.querySelector('.msg-bubble'), event, action => {
        if (sessionId !== String(currentSessionId || '') || !isAgentPeer(currentPeerId)) return false;
        if (action.kind === 'agent_open' && SparkAgentChannel.validAgentContact(action.value)) {
          const peer = Number(action.value);
          if (peer === Number(currentUserId)) return false;
          agentContacts.set(peer, action.label);
          showChatWindow(peer, buildSingleSessionId(currentUserId, peer));
          return true;
        }
        const command = SparkAgentChannel.commandForAction(action);
        if (!command) return false;
        return sendMsg(command, {...action, source_card: sourceCard});
      });
      const card = row.querySelector('.agent-model-picker');
      if (card) { card.dataset.agentSession = sessionId; card.dataset.agentCard = sourceCard; }
      updateAgentModelCards();
    }
