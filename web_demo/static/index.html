    // --- 核心业务逻辑 (复用原有逻辑，适配新UI) ---

    // 1. 登录/注册
    async function doLoginOrRegister(mode) {
      const epoch=authEpoch,request=++loginRequest;
      const account = document.getElementById('account').value.trim();
      const passwordRaw = document.getElementById('password').value;
      const nickname = document.getElementById('nickname').value.trim();
      const statusEl = document.getElementById('login-status');

      if (!account || !passwordRaw) {
        statusEl.textContent = '请输入账号和密码';
        return;
      }
      if (passwordRaw.length < 6) {
        statusEl.textContent = '密码至少 6 位';
        return;
      }
      const password = passwordRaw;

      try {
        statusEl.textContent = '请求中...';
        const url = logicBase + (mode === 'register' ? '/api/register' : '/api/login');
        const body = { account, password };
        if (mode === 'register' && nickname) {
             body.name = nickname;
        }

        const resp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await resp.json();
        if(epoch!==authEpoch || request!==loginRequest)return;

        if (data.code !== 0) {
          statusEl.textContent = data.message;
          return;
        }

        // 成功
        ++authEpoch;
        currentUserId = data.data.user_id;
        token = data.data.token;
        currentUserName = data.data.name || nickname || ('用户 ' + currentUserId);
        // 缓存本地
        Auth.set(currentUserId, token, currentUserName);

        statusEl.textContent = '';

        // 连接 WebSocket
        connectWebSocket();
        // 切换 UI
        updateUIState();

      } catch (e) {
        statusEl.textContent = '网络异常: ' + e;
      }
    }

    function clearCursorSync(sessionId) {
      for(const key of pendingCursorSync)if(key.startsWith(String(sessionId)+':'))pendingCursorSync.delete(key);
      cursorSyncStarted.delete(String(sessionId));
    }

    function reconcileCurrentConversation() {
      if(document.hidden || !token || !currentSessionId || !historyReady || ws?.readyState!==WebSocket.OPEN)return;
      const sid=String(currentSessionId);
      if(sid.startsWith('s_') && sessionWorkspaces.get(sid)?.exists===false){
        // A first message may create its SQL session only after reconnect.
        // Discover that object via the existing authenticated directory; all
        // message bodies still arrive through cursor sync.
        if(pendingConversationDiscovery)return;
        const epoch=authEpoch,controller=new AbortController();
        const operation={controller,promise:loadSingleSessionList({signal:controller.signal})};
        pendingConversationDiscovery=operation;
        const deadline=setTimeout(()=>controller.abort(),10000);
        operation.promise.finally(()=>{
          clearTimeout(deadline);
          if(pendingConversationDiscovery===operation)pendingConversationDiscovery=null;
          if(epoch===authEpoch && currentSessionId===sid && sessionWorkspaces.get(sid)?.exists===true)reconcileCurrentConversation();
        });
        return;
      }
      sendCursorSync(currentSessionId,sessionCursors[currentSessionId]||0);
    }
    // Kafka acceptance may precede SQL persistence. An empty reconnect sync
    // cannot prove that its tail will stay empty; keep checking the visible
    // conversation through the same authorized, idempotent recovery path.
    setInterval(reconcileCurrentConversation,5000);
    document.addEventListener('visibilitychange',reconcileCurrentConversation);

    function sendCursorSync(sessionId, afterSeq) {
      if (!sessionId || !ws || ws.readyState !== WebSocket.OPEN) return;
      if(sessionWorkspaces.get(String(sessionId))?.exists===false)return;
      if(String(sessionId).startsWith('r_')&&revokedRooms.has(Number(String(sessionId).slice(2))))return;
      const sid=String(sessionId),active=cursorSyncStarted.get(sid);
      if(active){
        if(Date.now()-active.started<15000)return;
        // A lost sync_end must not leave reconciliation blocked forever.
        clearCursorSync(sid);
      }
      const cursor = Number.isFinite(Number(afterSeq)) ? Number(afterSeq) : 0;
      const requestKey = String(sessionId) + ':' + cursor;
      pendingCursorSync.add(requestKey);
      cursorSyncStarted.set(sid,{started:Date.now(),after:cursor});
      try {
        ws.send(JSON.stringify({
          type: 'sync', session_id: String(sessionId), after_seq: cursor,
          limit: 100
        }));
      } catch (e) {
        clearCursorSync(sid);
      }
    }

    function advanceSessionCursor(sessionId, seq) {
      if (!sessionId || !Number.isFinite(Number(seq)) || Number(seq) <= 0) return;
      const sid = String(sessionId);
      const value = Number(seq);
      const seen = seenSessionSequences[sid] ||
        (seenSessionSequences[sid] = new Set());
      seen.add(value);
      let cursor = Number(sessionCursors[sid] || 0);
      while (seen.has(cursor + 1)) {
        seen.delete(cursor + 1);
        ++cursor;
      }
      sessionCursors[sid] = cursor;
      if (value > cursor + 1) sendCursorSync(sid, cursor);
      // 极端情况下服务端重复/乱序过多时，避免浏览器索引无限增长；
      // 重新从当前连续游标补齐即可。
      if (seen.size > 4096) {
        seen.clear();
        sendCursorSync(sid, cursor);
      }
    }

    function handleSyncEnd(obj) {
      const sid = String(obj.session_id || '');
      if (!sid) return;
      if(sid.startsWith('r_')&&revokedRooms.has(Number(sid.slice(2))))return;
      const after = Number(obj.after_seq || 0),active=cursorSyncStarted.get(sid);
      // A response to an expired, different page cannot release a newer
      // request or resume its old pagination. Same-page retries are idempotent.
      if(active && active.after!==after)return;
      clearCursorSync(sid);
      const seen = seenSessionSequences[sid] || new Set();
      let cursor = Number(sessionCursors[sid] || 0);
      const next = Number(obj.next_seq);
      const safe = Number(obj.safe_seq);
      if (after <= cursor && Number.isFinite(safe) && safe > cursor) cursor = safe;
      for (const value of seen) if (value <= cursor) seen.delete(value);
      while (seen.has(cursor + 1)) {
        seen.delete(cursor + 1);
        ++cursor;
      }
      sessionCursors[sid] = cursor;
      if (obj.has_more && Number.isFinite(next) && next > after) {
        sendCursorSync(sid, next);
      } else if (seen.size && Math.max(...seen) > cursor + 1) {
        const epoch=authEpoch,generation=wsGeneration,room=sid.startsWith('r_')?Number(sid.slice(2)):0,access=roomAccessEpoch.get(room)||0;
        setTimeout(() => {if(epoch===authEpoch&&generation===wsGeneration&&access===(roomAccessEpoch.get(room)||0))sendCursorSync(sid,sessionCursors[sid]||0);},1000);
      }
    }

    function renderSingleChatMessage(obj) {
      const sid = String(obj.session_id || '');
      const clientMsgId = String(obj.client_msg_id || '');
      if(sid.startsWith('r_')){
        if(sid!==currentSessionId)return;
        const envelope=roomEnvelope(obj),sender=Number(envelope.from_user_id);
        const row=renderMessageOnce(obj,getMsgText(obj),sender===Number(currentUserId),
          envelope.sender?.name||collaboration?.memberName(sender)||'成员',
          obj.timestamp_ms?new Date(obj.timestamp_ms).toLocaleTimeString():'');
        if(envelope.agent_id)collaboration?.agents.final(envelope);
        else if(envelope.request_id && sender===hermesBotUserId)collaboration?.cann.final(envelope.request_id);
        if(sender===Number(currentUserId))setMessageDeliveryState(obj,'已送达');return row;
      }
      if (isAgentPeer(obj.from_user_id) && clientMsgId.startsWith('hermes:')) {
        setSessionTask(sid, 'completed', '已完成');
      }
      if (!currentSessionId || sid !== String(currentSessionId)) return;
      const senderUserId = Number(
        obj.sender_id !== undefined ? obj.sender_id : obj.from_user_id);
      const isMe = senderUserId === Number(currentUserId);

      let senderDisplayName = '未知用户';
      if (obj.sender && obj.sender.name) {
        senderDisplayName = obj.sender.name;
      } else if (obj.sender_id) {
        senderDisplayName = 'User ' + obj.sender_id;
      } else if (obj.from_user_id) {
        senderDisplayName = 'User ' + obj.from_user_id;
      }

      const text = getMsgText(obj);
      const contentMeta = getMsgContentMeta(obj);
      let timeStr = '';
      if (obj.client_msg_id && /^\d+$/.test(String(obj.client_msg_id))) {
        timeStr = new Date(parseInt(obj.client_msg_id, 10)).toLocaleTimeString();
      }

      const isHermesFinal = isAgentPeer(obj.from_user_id) &&
        clientMsgId.startsWith('hermes:');
      if (isHermesFinal) {
        const requestId = clientMsgId.slice('hermes:'.length);
        hermesCompletedRequests.add(requestId);
        if (hermesCompletedRequests.size > 10000) {
          hermesCompletedRequests.delete(
            hermesCompletedRequests.values().next().value);
        }
        const state = hermesStreamStates.get(requestId);
        if (state) {
          // 最终消息是权威落库结果，覆盖尚未刷新的增量缓冲。
          state.pendingText = '';
          updateExistingMessageRow(state.row, text, false, agentName(obj.from_user_id), timeStr, {
            format: contentMeta.format === 'markdown' ? 'markdown' : undefined
          });
          state.row.classList.remove('hermes-streaming', 'hermes-thinking');
          state.progressNode?.remove();
          hermesStreamStates.delete(requestId);
          rememberRenderedMessage(obj, state.row);
          renderAgentPresentation(state.row, obj);
          orderMessageRow(state.row,obj);
          return;
        }
      }

      const row = renderMessageOnce(obj, text, isMe, senderDisplayName, timeStr, {
        format: isHermesFinal && contentMeta.format === 'markdown' ? 'markdown' : undefined
      });
      if (isMe) setMessageDeliveryState(obj, '已送达');
      return row;
    }

    function flushPendingLiveMessages() {
      if (!historyReady || !currentSessionId) return;
      const queued = pendingLiveMessages.splice(0);
      queued.sort((a, b) => Number(a.msg_seq || 0) - Number(b.msg_seq || 0));
      queued.forEach(message=>{renderSingleChatMessage(message);advanceSessionCursor(currentSessionId,message.msg_seq);});
      const state=workspaceFor(currentSessionId);state.bufferStart=null;
      if(state.recoveryFrom!==null){
        const after=state.recoveryFrom;state.recoveryFrom=null;
        sessionCursors[currentSessionId]=Math.min(Number(sessionCursors[currentSessionId]||0),after);
        delete seenSessionSequences[currentSessionId];
        clearCursorSync(currentSessionId);
        sendCursorSync(currentSessionId,after);
      }
    }

    function receiveConversationMessage(obj){
      const sid=String(obj.session_id||'');if(!sid || (sid.startsWith('r_')&&revokedRooms.has(Number(sid.slice(2)))))return;
      const state=workspaceFor(sid),before=Number(sessionCursors[sid]||0);
      state.exists=true;
      if(sid!==currentSessionId || !historyReady){
        if(state.bufferStart===null)state.bufferStart=before;
        if(state.pending.length<2000)state.pending.push(obj);
        else state.recoveryFrom=state.recoveryFrom===null?state.bufferStart:Math.min(state.recoveryFrom,state.bufferStart);
      }else renderSingleChatMessage(obj);
      if(sid!==currentSessionId || historyReady)advanceSessionCursor(sid,obj.msg_seq);
    }

    function handleWebSocketMessage(obj) {
      if(obj.type==='room_revoked'){invalidateSpace(obj.room_id);showToast('空间成员资格已撤销');return;}
      if(String(obj.session_id||'').startsWith('r_')&&revokedRooms.has(Number(obj.session_id.slice(2))))return;
      if (obj.type === 'accepted_ack') {
        if(obj.session_id)workspaceFor(obj.session_id).exists=true;
        setMessageDeliveryState(obj, '已接收');
        if (isAgentPeer(currentPeerId) &&
            String(obj.session_id || '') === String(currentSessionId || '')) {
          handleHermesAccepted(obj);
        }
      } else if (obj.type === 'delivered_ack') {
        setMessageDeliveryState(obj, '已送达');
      } else if (obj.type === 'sync_end') {
        handleSyncEnd(obj);
      } else if (obj.type === 'ack') {
        // 兼容 chatroom_join/leave 等控制 ACK。
      } else if (obj.type === 'error') {
        if (obj.client_msg_id) {
          setMessageDeliveryState(obj, '发送失败');
          offerMessageRetry(sentMessages.get(String(obj.session_id||currentSessionId||'')+':'+obj.client_msg_id));
          const key = String(obj.session_id || currentSessionId || '') + ':' + obj.client_msg_id;
          if (agentModelActions.has(key)) {
            agentModelResults.set(key, {ok: false});
            updateAgentModelCards();
          }
        }
        showToast('发送失败: ' + (obj.message || 'unknown'));
        if (currentSessionId && (!obj.session_id||obj.session_id===currentSessionId)) {
          appendSystemMsg('服务端错误: ' + (obj.message || '请求失败'));
        }
      } else if (obj.type === 'hermes_delta') {
        if(String(obj.session_id||'').startsWith('r_')){
          if(obj.agent_id)collaboration?.agents.delta(obj);else collaboration?.cann.delta(obj);
        }else handleHermesDelta(obj);
      } else if (obj.type === 'single_chat' || obj.type === 'chatroom') {
        receiveConversationMessage(obj);
      } else if (obj.type === 'system_broadcast') {
        const scope = obj.scope || 'all';
        if (scope === 'group') return;
        let text = '';
        if (obj.content && obj.content.text) text = obj.content.text;
        else if (typeof obj.content === 'string') text = obj.content;
        else text = JSON.stringify(obj.content);
        showToast('📢 全员广播: ' + text);
        if (currentSessionId) appendSystemMsg('收到全员广播: ' + text);
      }
    }

    function scheduleWebSocketReconnect() {
      if (!token || reconnectTimer) return;
      const delay = Math.min(1000 * Math.pow(2, reconnectAttempt++), 10000);
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        connectWebSocket();
      }, delay);
    }

    // 2. WebSocket：断线指数退避重连；重连成功后由 Comet 离线补推，
    // 当前会话再走 cursor sync，前端按 msg_seq 去重。
    function connectWebSocket() {
      if (!token) return;
      setConnectionStatus('正在连接…');
      if (ws) {
        ws.onclose = null;
        ws.close();
      }
      const socketGeneration = ++wsGeneration;
      pendingCursorSync.clear();
      cursorSyncStarted.clear();
      const socket = new WebSocket(cometWsUrl + '?token=' + encodeURIComponent(token));
      ws = socket;

      socket.onopen = () => {
        if (socketGeneration !== wsGeneration) return;
        reconnectAttempt = 0;
        if (wasConnected && currentSessionId && historyReady) {
          appendSystemMsg('连接已恢复，正在补齐消息');
        }
        wasConnected = true;
        setConnectionStatus('已连接');
        if(currentConversation?.kind==='room'){
          const room=currentConversation.room_id,epoch=chatViewGeneration;
          clientApi('/api/spaces/members',{room_id:room}).then(()=>{
            if(epoch===chatViewGeneration){sendRoomPresence('chatroom_join',room);collaboration?.agents.refresh();}
          }).catch(error=>{if(epoch===chatViewGeneration && (error.code===403||error.code===404))invalidateSpace(room);});
        }
        if (currentSessionId && historyReady) {
          sendCursorSync(currentSessionId, sessionCursors[currentSessionId] || 0);
        }
        loadSingleSessionList();
        collaboration?.refresh();
      };

      socket.onmessage = (ev) => {
        if (socketGeneration !== wsGeneration) return;
        try {
          handleWebSocketMessage(JSON.parse(ev.data));
        } catch (e) {
          console.error('WebSocket message parse error', e);
        }
      };

      socket.onerror = () => {
        if (socketGeneration === wsGeneration) socket.close();
      };
      socket.onclose = () => {
        if (socketGeneration !== wsGeneration) return;
        ws = null;
        setConnectionStatus('连接已断开，正在重连…',true);
        for(const record of sentMessages.values()){setMessageDeliveryState({...record.payload,session_id:record.sessionId},'连接中断，结果待确认');offerMessageRetry(record);}
        // 握手阶段被 Logic 拒绝时，浏览器只暴露 close，不暴露服务端的 401
        // 原因。连续失败后主动验证 HTTP Token，失效就清理本地会话并显示登录框。
        if (reconnectAttempt >= 2) {
          const savedSession = Auth.get();
          if (savedSession) {
            validateSavedSession(savedSession);
            return;
          }
        }
        scheduleWebSocketReconnect();
      };
    }

    // 3. 获取会话列表
    async function loadSingleSessionList(options={}) {
      if (!currentUserId) return;
      const requestId = ++sessionListRequestId;
      const epoch=authEpoch;
      try {
        const resp = await fetch(logicBase + '/api/session/list_single', {
          method: 'POST',
          signal:options.signal,
          headers: {
            'Content-Type': 'application/json',
            ...(token ? { 'Authorization': 'Bearer ' + token } : {})
          },
          body: JSON.stringify({ user_id: currentUserId })
        });
        const data = await resp.json();
        if (epoch===authEpoch && requestId === sessionListRequestId && data.code === 0 &&
            currentUserId) {
          renderSessionList(data.data.sessions || []);
        }
      } catch(e) {
        if (requestId === sessionListRequestId) {
          console.error('List session error', e);
        }
      }
    }

    function renderSessionList(list) {
      const container = document.getElementById('session-list');
      container.innerHTML = '';
      if (list.length === 0) {
        const empty = document.createElement('div');
        empty.style.cssText = 'text-align:center;color:#999;font-size:12px;margin-top:20px;';
        empty.textContent = '暂无历史会话';
        container.appendChild(empty);
        return;
      }

      list.forEach(s => {
        if(String(s.session_id)===String(currentSessionId))workspaceFor(s.session_id).exists=true;
        contactNames.set(Number(s.peer_user_id),s.peer_name||'私聊');
        const div = document.createElement('div');
        div.className = 'session-item';
        if (String(s.session_id) === String(currentSessionId)) div.classList.add('active');
        div.dataset.sid = s.session_id;

        const isHermes = isAgentPeer(s.peer_user_id);
        const avatar = document.createElement('div');
        avatar.className = 'avatar-placeholder';
        avatar.style.background = isHermes ? '#7c3aed' : '#90caf9';
        const rawUid = String(s.peer_user_id || '');
        // 若 UserID 较长（如 9000000010），取后 4 位或短字符展示，防止圆形头像数字溢出
        avatar.textContent = isHermes ? '✦' : (s.peer_name||'友').slice(0,1);
        const info = document.createElement('div');
        info.className = 'session-info';
        const name = document.createElement('div');
        name.className = 'session-name';
        name.textContent = isHermes ? agentName(s.peer_user_id) : (s.peer_name||'私聊');
        const preview = document.createElement('div');
        preview.className = 'session-preview';
        const task = workspaceFor(s.session_id) && workspaceFor(s.session_id).task;
        if (task && task.state && task.state !== 'idle') {
          preview.classList.add('task-active');
          preview.textContent = task.text || task.state;
        } else {
          preview.textContent = s.unread_count>0?s.unread_count+' 条未读':'继续交流';
        }
        info.appendChild(name);
        info.appendChild(preview);
        div.appendChild(avatar);
        div.appendChild(info);
        div.onclick = () => {
          showChatWindow(s.peer_user_id, s.session_id);
        };
        container.appendChild(div);
      });
    }

    // Elapsed display is local, not a claim that the backend is alive.
    setInterval(() => {
      for (const state of hermesStreamStates.values()) {
        const elapsed = Math.floor((Date.now() - state.startedAt) / 1000);
        const quiet = Math.floor((Date.now() - state.lastActivity) / 1000);
        state.progressNode.textContent = state.progressText + ' · 等待 ' + elapsed + ' 秒' +
          (quiet >= 30 ? ' · ' + quiet + ' 秒未收到新进度' : '');
      }
    }, 1000);

    function createHermesStreamState(requestId, thinking) {
      const row = appendMsgRow(thinking ? agentName(currentPeerId) + ' 正在思考…' : '', false,
        agentName(currentPeerId));
      row.classList.add('hermes-streaming');
      if (thinking) row.classList.add('hermes-thinking');
      const state = {
        row,
        bubble: row.querySelector('.msg-bubble'),
        text: '',
        pendingText: '',
        framePending: false,
        thinking: !!thinking,
        autoScroll: true,
        nextEventSequence: 0,
        eventBuffer: new Map(),
        seenEventIds: new Set()
      };
      const progress = document.createElement('div');
      progress.className = 'agent-stream-progress'; progress.setAttribute('role', 'status');
      progress.setAttribute('aria-live', 'polite');
      row.querySelector('.msg-bubble').after(progress);
      state.progressNode = progress; state.startedAt = Date.now(); state.lastActivity = Date.now();
      state.progressText = '请求已接收，等待 Agent 处理';
      progress.textContent = state.progressText;
      hermesStreamStates.set(requestId, state);
      return state;
    }

    function flushHermesStream(requestId, state) {
      state.framePending = false;
      if (hermesStreamStates.get(requestId) !== state) return;
      if (state.pendingText) {
        state.text += state.pendingText;
        state.pendingText = '';
        state.bubble.textContent = state.text;
      }
      if (state.autoScroll) {
        const container = document.getElementById('messages');
        container.scrollTop = container.scrollHeight;
      }
    }

    function scheduleHermesStreamFlush(requestId, state) {
      if (state.framePending) return;
      state.framePending = true;
      const flush = () => flushHermesStream(requestId, state);
      if (typeof window.requestAnimationFrame === 'function') {
        window.requestAnimationFrame(flush);
      } else {
        setTimeout(flush, 16);
      }
    }

    function handleHermesAccepted(obj) {
      const requestId = String(obj.msg_id || '');
      const sid = String(obj.session_id || '');
      if (!requestId || !sid) return;
      setSessionTask(sid, 'queued', '排队中');
      if (hermesCompletedRequests.has(requestId)) return;
      if (sid !== String(currentSessionId || '')) return;
      if (!hermesStreamStates.has(requestId)) {
        createHermesStreamState(requestId, true);
      }
    }

    function applyHermesStreamEvent(requestId, state, delta, progress) {
       state.lastActivity = Date.now();
       if (progress) {
         state.progressText = delta;
         state.progressNode.textContent = delta;
         return;
       }
       state.progressText = '正在生成回答';
       if (state.thinking) {
         state.thinking = false;
         state.row.classList.remove('hermes-thinking');
         state.bubble.textContent = '';
       }
       const container = document.getElementById('messages');
       state.autoScroll = container.scrollHeight - container.scrollTop -
         container.clientHeight < 96;
       state.pendingText += delta;
       scheduleHermesStreamFlush(requestId, state);
    }

    function handleHermesDelta(obj) {
       const requestId = String(obj.request_id || '');
       const delta = String(obj.delta || '');
       const sid = String(obj.session_id || '');
       if (!requestId || !delta || hermesCompletedRequests.has(requestId)) return;
       if (obj.progress === true) setSessionTask(sid, 'executing', delta);
       else setSessionTask(sid, 'generating', '正在生成');
       if (!currentSessionId || sid !== String(currentSessionId)) return;

       let sequence = Number.isInteger(Number(obj.delta_index)) ? Number(obj.delta_index) : null;
       let eventId = '';
       const event = obj.agent_event;
       if (event !== undefined) {
         const envelope = event && event.envelope;
         const expectedType = obj.progress === true ? 'assistant_progress' : 'assistant_delta';
         if (!envelope || event.schema !== 'sparkpush.agent_event.v1' ||
             event.type !== expectedType || String(event.data?.text || '') !== delta ||
             envelope.schema !== 'sparkpush.agent_envelope.v1' ||
             String(envelope.request_id || '') !== requestId ||
             String(envelope.conversation_id || '') !== String(currentSessionId) ||
             !Number.isInteger(Number(envelope.sequence)) || Number(envelope.sequence) < 0 ||
             envelope.terminal !== false) return;
         sequence = Number(envelope.sequence);
         eventId = String(envelope.event_id || '');
       }

       let state = hermesStreamStates.get(requestId);
       if (!state) state = createHermesStreamState(requestId, false);
       if (eventId) {
         if (state.seenEventIds.has(eventId)) return;
         state.seenEventIds.add(eventId);
         if (state.seenEventIds.size > 4096)
           state.seenEventIds.delete(state.seenEventIds.values().next().value);
       }
       if (sequence === null) {
         applyHermesStreamEvent(requestId, state, delta, obj.progress === true);
         return;
       }
       if (sequence < state.nextEventSequence || state.eventBuffer.has(sequence)) return;
       state.eventBuffer.set(sequence, {delta, progress: obj.progress === true});
       if (state.eventBuffer.size > 256) {
         // The final durable message will replace the preview. Bound a corrupt
         // or permanently gapped transient stream instead of growing memory.
         state.eventBuffer.clear();
         state.nextEventSequence = sequence + 1;
         return;
       }
       while (state.eventBuffer.has(state.nextEventSequence)) {
         const current = state.eventBuffer.get(state.nextEventSequence);
         state.eventBuffer.delete(state.nextEventSequence++);
         applyHermesStreamEvent(requestId, state, current.delta, current.progress);
       }
    }

    // 4. 开启新会话 (build ID)
    function buildSingleSessionId(u1, u2) {
       const a = Number(u1); const b = Number(u2);
       if(!a || !b) return null;
       return 's_' + Math.min(a,b) + '_' + Math.max(a,b);
    }

    // 5. 历史记录（支持分页 / 滚动加载）
    async function loadHistory(isInitial,
                               viewGeneration = chatViewGeneration,
                               requestedSessionId = currentSessionId) {
       if (!requestedSessionId || viewGeneration !== chatViewGeneration ||
           currentSessionId !== requestedSessionId) return;
       if (historyLoading) return;

       // 非首次加载且没有更多历史时，直接返回
       if (!isInitial && (!historyHasMore || !historyAnchorSeq)) return;

       historyLoading = true;
       let succeeded=false;
       const pageSize = 50;
       const anchor = isInitial ? 0 : historyAnchorSeq;
       const controller = new AbortController();
       historyRequestController = controller;

       try {
         const resp = await fetch(logicBase + '/api/session/history', {
           method: 'POST',
           headers: {
             'Content-Type': 'application/json',
             ...(token ? { 'Authorization': 'Bearer ' + token } : {})
           },
           signal: controller.signal,
           body: JSON.stringify({
             session_id: requestedSessionId,
             anchor_seq: anchor,
             limit: pageSize
           })
         });
         const data = await resp.json();
         // 用户切换会话后，旧请求的结果不能写入当前窗口。
         if (viewGeneration !== chatViewGeneration ||
             currentSessionId !== requestedSessionId) return;
         if (data.code !== 0 && !(isInitial && data.code === 404)) {
           if(data.code===403 && requestedSessionId.startsWith('r_')){invalidateSpace(Number(requestedSessionId.slice(2)));showToast('无法访问该空间');return;}
           appendSystemMsg('加载历史失败: ' + data.message);
           return;
         }
         succeeded=true;
         const workspace=workspaceFor(requestedSessionId);
         workspace.exists=data.code!==404 || workspace.exists===true;

         const msgs = data.code === 404 ? [] : ((data.data && data.data.messages) || []);
         // A recent history page is a display window, not proof that SQL has
         // persisted every sequence up to its maximum. Start at its lower edge
         // on the first visit, then reuse contiguous/gap recovery for the page.
         if(isInitial && !sessionCursors[requestedSessionId] && msgs.length){
           const sequences=[...msgs,...pendingLiveMessages].map(m=>Number(m.msg_seq)).filter(n=>n>0);
           const seen=seenSessionSequences[requestedSessionId];if(seen)sequences.push(...seen);
           sessionCursors[requestedSessionId]=Math.max(0,Math.min(...sequences)-1);
         }
         const container = document.getElementById('messages');
         // The shared renderer orders durable rows by msg_seq and keeps
         // optimistic/streaming rows last, including a history-only final.
         if (msgs.length === 0) {
           if (isInitial && pendingLiveMessages.length === 0) {
             appendSystemMsg('暂无历史消息');
           }
           historyHasMore = false;
           return;
         }

         const oldScrollHeight = container.scrollHeight;

         msgs.forEach(m => {
           advanceSessionCursor(requestedSessionId,m.msg_seq);
           lastHistorySeq = Math.max(lastHistorySeq, m.msg_seq || 0);
           const isMe = Number(m.sender_id) === Number(currentUserId);
           const text = getMsgText(m);

           // 尝试解析 sender name
           let displayName = Number(m.sender_id)===Number(currentUserId)?currentUserName:(requestedSessionId.startsWith('r_')?collaboration?.memberName(m.sender_id):(contactNames.get(Number(m.sender_id))||'成员'));
           try {
              const contentObj = (typeof m.content === 'string') ? JSON.parse(m.content) : m.content;
              if (contentObj && contentObj.sender && contentObj.sender.name) {
                 displayName = contentObj.sender.name;
              }
           } catch(e){}

           const timeStr = m.timestamp_ms ? new Date(m.timestamp_ms).toLocaleTimeString() : '';

           // History API omits top-level session_id. Bind card actions to the
           // authenticated query's session, never the currently selected peer.
           renderMessageOnce({...m, session_id: requestedSessionId}, text, isMe, displayName, timeStr, {
             prepend: !isInitial,
             keepScroll: !isInitial,
             deferScroll: true,
             format: isAgentPeer(m.sender_id) &&
               getMsgContentMeta(m).format === 'markdown' ? 'markdown' : undefined
           });
         });

         // 更新 anchor_seq：使用本次批次中最早一条的 msg_seq
         const first = msgs[0];
         if (first && Number.isFinite(Number(first.msg_seq))) {
           const firstSeq = Number(first.msg_seq);
           if (!historyAnchorSeq || firstSeq < historyAnchorSeq) {
             historyAnchorSeq = firstSeq;
           }
         }
         historyHasMore = msgs.length >= pageSize && historyAnchorSeq > 1;

         if (!isInitial) {
           const newScrollHeight = container.scrollHeight;
           container.scrollTop = newScrollHeight - oldScrollHeight;
         } else {
           container.scrollTop = container.scrollHeight;
         }
       } catch(e) {
         if (viewGeneration === chatViewGeneration &&
             currentSessionId === requestedSessionId &&
             e.name !== 'AbortError') {
           appendSystemMsg('加载历史失败: ' + e);
         }
       } finally {
         if (historyRequestController === controller) {
           historyRequestController = null;
         }
         if (viewGeneration === chatViewGeneration &&
             currentSessionId === requestedSessionId) {
           historyLoading = false;
           workspaceFor(requestedSessionId).retryHistory=!succeeded;
           document.getElementById('load-more-btn').textContent=succeeded?'历史消息':'重试加载历史';
           if (isInitial) {
             historyReady = true;
             flushPendingLiveMessages();
             sendCursorSync(requestedSessionId,sessionCursors[requestedSessionId]||0);
           }
         }
       }
    }

    // 6. 发送消息
    async function sendMsg(commandText, agentAction) {
       if(uploadingMessage)return;
       const sessionId=currentSessionId,generation=chatViewGeneration,epoch=authEpoch,credential=token;
       const room=currentConversation?.kind==='room'?Number(currentConversation.room_id):0;
       const fromAction = typeof commandText === 'string';
       const draftValue=document.getElementById('msg-text').value,images=pendingImages.slice();
       const text = fromAction ? commandText : draftValue.trim();
       const hasImages = !fromAction && pendingImages.length > 0;
       if (!text && !hasImages) return;

       const peerId = Number(currentPeerId);
       // 未点「私聊」或填了账号名时，Number 会得到 NaN，JSON 会序列化成 null，服务端直接拒绝
       if (!sessionId || (!room && (!Number.isFinite(peerId) || peerId <= 0))) {
         showToast('请先选择一个会话');
         return;
       }

       if (!ws || ws.readyState !== WebSocket.OPEN) {
         appendSystemMsg('WebSocket 未连接，无法发送');
         return;
       }

       let attachments = [];
       const mentions=room?collaboration.agents.mentions():[];
       if (hasImages) {
         const controller=new AbortController();uploadController=controller;
         uploadingMessage=true;
         try {
           attachments = await uploadPendingImages(sessionId,images,credential,controller.signal);
         } catch (e) {
           if(generation===chatViewGeneration && epoch===authEpoch)appendSystemMsg('图片上传失败: ' + (e.message || e));
           return;
         }finally{if(uploadController===controller){uploadingMessage=false;uploadController=null;}}
       }
       if(epoch!==authEpoch || generation!==chatViewGeneration || sessionId!==currentSessionId){showToast('会话已切换，消息保留在原草稿中');return;}

       const payload = {
         type: room?'chatroom':'single_chat',
         ...(room?{group_id:room}:{to_user_id:peerId}),
         client_msg_id: Date.now().toString() + '-' +
           Math.random().toString(36).slice(2, 8),
         content: { text: text || (attachments.length ? '请查看这张图片。' : '') }
       };
       if (attachments.length) payload.content.attachments = attachments;
       if(mentions.length)payload.agent_mentions=mentions;
       if (agentAction && isAgentPeer(peerId) &&
           SparkAgentChannel.commandForAction(agentAction) === text) {
         const {kind, value, provider, modelId, source_card} = agentAction;
         payload.content.agent_action = {kind, value, provider, modelId};
         if (typeof source_card === 'string' && source_card.length <= 128)
           payload.content.agent_action.source_card = source_card;
       }
       try {
         if (ws.bufferedAmount > 1024 * 1024) {
           appendSystemMsg('发送队列繁忙，请稍后重试');
           return;
         }
         ws.send(JSON.stringify(payload));
       } catch (e) {
         appendSystemMsg('发送失败，连接正在恢复');
         scheduleWebSocketReconnect();
         return;
       }

       // 乐观更新 UI
       const row=renderMessageOnce({...payload, session_id: sessionId, from_user_id: currentUserId}, SparkAgentChannel.displayAction(payload.content) || payload.content.text, true, currentUserName||'我', '', {
         optimistic: true,
         statusText: '发送中',
         attachments
       });
       sentMessages.set(sessionId+':'+payload.client_msg_id,{sessionId,payload,row,epoch});
       if (!fromAction) {
         const input=document.getElementById('msg-text'),unchanged=input.value===draftValue;
         if(unchanged)input.value='';
         pendingImages = pendingImages.filter(image=>!images.includes(image));
         renderPendingImages();
         conversationDrafts.set(String(sessionId),input.value);conversationPendingImages.set(String(sessionId),pendingImages.slice());
         if(room&&unchanged&&JSON.stringify(mentions)===JSON.stringify(collaboration.agents.mentions()))collaboration.agents.sent();
       }
       return true;
    }

    document.getElementById('start-hermes-btn').onclick = () => {
      if (!currentUserId) return;
      showChatWindow(hermesBotUserId,
        buildSingleSessionId(currentUserId, hermesBotUserId));
    };

    document.getElementById('agent-directory-btn').onclick = async () => {
      if (!currentUserId) return;
      if (!isAgentPeer(currentPeerId))
        showChatWindow(hermesBotUserId, buildSingleSessionId(currentUserId, hermesBotUserId));
      const sid = currentSessionId;
      for (let attempt = 0; attempt < 100 && !historyReady && sid === currentSessionId; ++attempt)
        await new Promise(resolve => setTimeout(resolve, 50));
      if (sid === currentSessionId && historyReady) sendMsg('/agent', {kind: 'agent'});
    };

    // 辅助：解析消息内容
    function getMsgContentMeta(obj) {
       if (!obj || obj.content === undefined || obj.content === null) return {};
       try {
         const outer = typeof obj.content === 'string' ? JSON.parse(obj.content) : obj.content;
         if (!outer || typeof outer !== 'object') return {};
         if (outer.content && typeof outer.content === 'object') return outer.content;
         return outer;
       } catch (_) {
         return {};
       }
    }

    function getMsgText(obj) {
       if (!obj.content) return '[空]';
       const actionText = SparkAgentChannel.displayAction(getMsgContentMeta(obj));
       if (actionText) return actionText;
       try {
         // 兼容 content 是 string 或 object
         const c = (typeof obj.content === 'string') ? JSON.parse(obj.content) : obj.content;

         // 1. 直接包含 text (如 HTTP 发送的消息)
         if (c.text) return c.text;

         // 2. 嵌套结构 (如 WebSocket 上行存库后的数据，外层包裹了 msg_id 等)
         if (c.content) {
            // 可能是 {content: {text: "..."}}
            if (typeof c.content === 'object' && c.content.text) return c.content.text;
            // 可能是 {content: "..."}
            if (typeof c.content === 'string') return c.content;
         }

         return JSON.stringify(c);
       } catch(e) {
         return String(obj.content);
       }
    }

    // 辅助：刷新未读 / 标记已读
    async function refreshUnread() {
      if(!currentSessionId || !currentUserId || !token) return;
      const generation=chatViewGeneration,epoch=authEpoch;
      try {
        const resp = await fetch(logicBase + '/api/session/unread', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({
            user_id: Number(currentUserId), session_id: currentSessionId
          })
        });
        const data = await resp.json();
        if (generation===chatViewGeneration && epoch===authEpoch && String(currentSessionId) && data.code === 0) {
          document.getElementById('unread-count').textContent =
            String((data.data && data.data.unread) || 0);
        }
      } catch (e) {
        console.error('Unread query error', e);
      }
    }
    document.getElementById('mark-read-btn').onclick = async () => {
      if(!currentSessionId || !lastHistorySeq || !currentUserId || !token) return;
      const generation=chatViewGeneration,epoch=authEpoch;
      try {
        const resp = await fetch(logicBase + '/api/session/mark_read', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({
            user_id: Number(currentUserId), session_id: currentSessionId,
            read_seq: Number(lastHistorySeq)
          })
        });
        const data = await resp.json();
        if(generation!==chatViewGeneration||epoch!==authEpoch)return;
        if (data.code !== 0) {
          appendSystemMsg('标记已读失败: ' + (data.message || 'unknown'));
          return;
        }
        document.getElementById('unread-count').textContent = '0';
        showToast('已标记已读');
      } catch (e) {
        if(generation===chatViewGeneration&&epoch===authEpoch)appendSystemMsg('标记已读失败，请稍后重试');
      }
    };

    // 辅助：显示 Toast
    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const div = document.createElement('div');
      div.className = 'toast';
      div.textContent = msg;
      container.appendChild(div);

      // Auto remove
      setTimeout(() => {
        div.style.animation = 'toast-out 0.3s ease-in forwards';
        div.addEventListener('animationend', () => {
          if(div.parentNode) div.parentNode.removeChild(div);
        });
      }, 3000);
    }

    // --- 事件绑定 ---
    document.querySelectorAll('.auth-tab').forEach(btn => {
       btn.onclick = () => {
         document.querySelectorAll('.auth-tab').forEach(b => b.classList.remove('active'));
         btn.classList.add('active');
         const mode = btn.dataset.mode;
         const regBtn = document.getElementById('register-btn');
         const logBtn = document.getElementById('login-btn');
         const nickGroup = document.getElementById('nickname-group');

         if(mode === 'login') {
            regBtn.classList.add('hidden');
            logBtn.classList.remove('hidden');
            nickGroup.classList.add('hidden');
         } else {
            regBtn.classList.remove('hidden');
            logBtn.classList.add('hidden');
            nickGroup.classList.remove('hidden');
         }
       };
    });

    document.getElementById('login-btn').onclick = () => doLoginOrRegister('login');
    document.getElementById('register-btn').onclick = () => doLoginOrRegister('register');
    document.getElementById('password').onkeydown = (e) => {
       if(e.key === 'Enter') {
          const isReg = !document.getElementById('register-btn').classList.contains('hidden');
          doLoginOrRegister(isReg ? 'register' : 'login');
       }
    };

    document.getElementById('start-chat-btn').onclick = async () => {
       const account=document.getElementById('to-user').value;if(!account||!currentUserId)return;
       const generation=chatViewGeneration;
       try{const contact=await clientApi('/api/users/lookup',{account});if(generation!==chatViewGeneration)return;
         if(Number(contact.user_id)===Number(currentUserId)){showToast('请选择其他成员');return;}
         contactNames.set(Number(contact.user_id),contact.name||contact.account);
         showChatWindow(contact.user_id,buildSingleSessionId(currentUserId,contact.user_id));
       }catch(error){showToast(error.message);}
    };

    document.getElementById('refresh-sessions-btn').onclick = loadSingleSessionList;
    document.getElementById('send-btn').onclick = sendMsg;
    document.getElementById('agent-commands-btn').onclick = () => {
      if (!isAgentPeer(currentPeerId)) { showToast('请先打开 Agent 会话'); return; }
      sendMsg('/help', {kind: 'help'});
    };
    document.getElementById('attach-btn').onclick = () => document.getElementById('image-file').click();
    document.getElementById('image-file').onchange = (e) => {
      Array.from(e.target.files || []).forEach(fileToPending);
      e.target.value = '';
    };
    document.getElementById('msg-text').onkeydown = (e) => { if(e.key==='Enter') sendMsg(); };
    document.getElementById('msg-text').addEventListener('paste', (e) => {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      let used = false;
      for (const item of items) {
        if (item.kind === 'file' && item.type.startsWith('image/')) {
          fileToPending(item.getAsFile());
          used = true;
        }
      }
      if (used) e.preventDefault();
    });
    document.getElementById('messages').addEventListener('dragover', (e) => {
      e.preventDefault();
    });
    document.getElementById('messages').addEventListener('drop', (e) => {
      e.preventDefault();
      Array.from(e.dataTransfer.files || []).forEach(fileToPending);
    });

    // 点击“拉取更多历史”按钮时，向前分页加载
    document.getElementById('load-more-btn').onclick = () => {
      loadHistory(!historyAnchorSeq || workspaceFor(currentSessionId)?.retryHistory);
    };

    // 上滑到顶部时自动加载更多历史；远离底部时显示「回到最新」
    const backToLatestBtn = document.getElementById('back-to-latest');
    backToLatestBtn.onclick = () => {
      const container = document.getElementById('messages');
      container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
    };
    document.getElementById('messages').addEventListener('scroll', function() {
      if (this.scrollTop < 40 && !historyLoading && historyHasMore && currentSessionId) {
        loadHistory(false);
      }
      const distToBottom = this.scrollHeight - this.scrollTop - this.clientHeight;
      backToLatestBtn.classList.toggle('visible', distToBottom > 400);
    });

    SparkAgentConnections.mount({button:document.getElementById('my-agents-btn'),
      getToken:()=>token, apiBase:logicBase,
      openChat:(peer, name)=>{
        agentContacts.set(peer, name);
        const sid='s_'+Math.min(currentUserId,peer)+'_'+Math.max(currentUserId,peer);
        showChatWindow(peer,sid);
      }});

    collaboration=new SparkCollaborationUI({api:clientApi,user:()=>currentUserId,active:()=>currentSessionId,
      access:room=>roomAccessEpoch.get(Number(room))||0,
      open:showChatWindow,invalidate:invalidateSpace,notice:showToast,
      append:(text,isMe,name,_system,time,options)=>appendMsgRow(text,isMe,name,time,options),
      agentsLoaded:()=>document.querySelectorAll('#messages .msg-row').forEach(row=>{if(row._sparkMessage)decorateRoomMessage(row,row._sparkMessage);})});
    collaboration.client.membersLoaded=()=>document.querySelectorAll('#messages .msg-row').forEach(row=>{if(row._sparkMessage){decorateSenderName(row,row._sparkMessage);decorateRoomMessage(row,row._sparkMessage);}});
    document.getElementById('reconnect-btn').onclick=()=>{if(reconnectTimer){clearTimeout(reconnectTimer);reconnectTimer=null;}connectWebSocket();};

    // 初始化：不要直接相信 localStorage 中的身份；先通过 Logic 校验 Token。
    const savedSession = Auth.get();
    if (savedSession) {
      document.getElementById('login-status').textContent = '正在验证登录状态...';
      validateSavedSession(savedSession);
    } else {
      updateUIState();
    }
  </script>
</body>
</html>
