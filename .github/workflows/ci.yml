name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake libssl-dev default-libmysqlclient-dev \
            libhiredis-dev librdkafka-dev libprotobuf-dev protobuf-compiler \
            protobuf-compiler-grpc libgrpc++-dev nlohmann-json3-dev redis-server

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build -j2

      - name: Unit tests
        run: cd build && ctest --output-on-failure

      - name: Redis sequence integration test
        run: |
          redis-server --daemonize yes
          cd build
          SPARK_PUSH_RUN_REDIS_TESTS=1 ctest -R redis_sequence_integration_test --output-on-failure
