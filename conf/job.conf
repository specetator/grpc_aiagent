# Kafka 消费端配置
kafka_brokers=127.0.0.1:9092
kafka_consumer_group=spark_push_group
kafka_single_topic=push_single
kafka_group_topic=push_group
kafka_push_topic=push_to_comet
kafka_broadcast_topic=broadcast_task
kafka_persist_topic=persist_message

# comet 目标列表（格式：id=host:port，对应 comet 的 gRPC 端口，多个用逗号分隔）
comet_targets=comet-1=127.0.0.1:9105
metrics_port=9202

# Job -> Comet 长连接推送；流断开会指数退避重连并重放当前 request_id。
use_push_stream=true
push_stream_queue_max=10000
push_stream_reconnect_base_ms=200
push_stream_reconnect_max_ms=5000
push_rpc_deadline_ms=2000
delivery_workers=8

# Job 持久化消费者使用同一套 MySQL 配置，密码从环境变量注入。
mysql_host=127.0.0.1
mysql_port=3307
mysql_user=root
mysql_password=${SPARK_PUSH_MYSQL_PASSWORD}
mysql_db=spark_push
mysql_pool_size=8
mysql_pool_min_size=2
mysql_pool_max_size=16

# Durable delivery resolves current per-user leases from the same Redis DB as Logic.
redis_host=127.0.0.1
redis_port=6379
redis_password=${SPARK_PUSH_REDIS_PASSWORD}
redis_db=0
redis_pool_size=8
redis_max_pool_size=16
