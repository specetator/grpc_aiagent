# 逻辑服务监听地址（grpc，供 comet/job 等内部服务调用）
listen_addr=0.0.0.0
listen_port=9100

# 对外 HTTP 接口端口（客户端或管理接口访问）
http_port=9101

# Kafka 推送/广播配置。单聊、群聊使用独立 topic，避免相互争抢 partition。
kafka_brokers=127.0.0.1:9092
kafka_single_topic=push_single
kafka_group_topic=push_group
# 旧版统一 topic 仅用于兼容旧配置，不参与根目录默认链路。
kafka_push_topic=push_to_comet
kafka_broadcast_topic=broadcast_task
kafka_persist_topic=persist_message
kafka_ai_request_topic=ai_request
kafka_ai_delta_topic=ai_delta
kafka_ai_reply_topic=ai_reply

# Redis 连接池配置
redis_host=127.0.0.1
redis_port=6379
redis_password=
redis_db=0
# 热路径 Redis INCR / 路由查询更吃连接
redis_pool_size=16
redis_max_pool_size=32

# MySQL 连接池配置（用户/历史/游标等 Logic 查询使用；消息持久化由 Job 消费 topic）
# 本机 Docker MySQL 映射到 3307（见新手上手指南运行说明）
mysql_host=127.0.0.1
mysql_port=3307
mysql_user=root
mysql_password=${SPARK_PUSH_MYSQL_PASSWORD}
mysql_db=spark_push
mysql_pool_size=16
mysql_pool_min_size=4
mysql_pool_max_size=32

# 可选管理员账号。任一项为空时管理登录关闭；不要在仓库中写真实口令。
admin_account=${SPARK_PUSH_ADMIN_ACCOUNT}
admin_password=${SPARK_PUSH_ADMIN_PASSWORD}

# Hermes Bot：默认关闭；开启后由 scripts/start_demo.sh 同时启动 hermes_bridge。
hermes_enabled=${SPARK_PUSH_HERMES_ENABLED}
hermes_bot_user_id=900000000001

# 单聊/群聊/广播独立令牌桶；超限请求返回 429，Kafka 本身提供有界排队。
single_rate_per_sec=1000
single_burst=200
group_rate_per_sec=300
group_burst=60
broadcast_rate_per_sec=20
broadcast_burst=5
persist_kafka_timeout_ms=5000
