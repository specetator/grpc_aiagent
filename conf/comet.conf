# comet TCP 监听（客户端长连接，对外暴露）
listen_addr=0.0.0.0
listen_port=9000

# comet 的 gRPC 端口及 ID（供 logic/job 等内部服务调用）
comet_grpc_port=9105
metrics_port=9203
comet_id=comet-1

# logic 服务 gRPC 地址（指向 logic 的 listen_port）
logic_grpc_target=127.0.0.1:9100

# comet I/O 工作线程数
comet_io_threads=8
# Unary gRPC 异步线程池
comet_grpc_pool_size=8
# Comet→Logic 每条同步流会等待 persist Kafka delivery report；增加流数
# 允许更多消息并发越过 accepted 边界，同时仍由 request_id 匹配响应。
use_grpc_stream=true
grpc_stream_count=8
# Logic 重启后 MessageStream 必须自动重连；否则握手仍成功、发消息会一直「发送中」。
grpc_stream_reconnect_base_ms=200
grpc_stream_reconnect_max_ms=5000
# Write 成功但 Logic 一直不回包时，超时失败 callback，避免气泡停在「发送中」。
# 须大于 persist_kafka_timeout_ms（accepted_ack 要等 Kafka delivery report）。
grpc_stream_ack_timeout_ms=8000
