# Agent Bridge 配置（进程名仍为 hermes_bridge）。目标是本机 Pi gateway。
# 敏感字段从 .env.local 环境变量展开，不要写真实 API Key。
kafka_brokers=127.0.0.1:9092
kafka_request_topic=ai_request
kafka_delta_topic=ai_delta
kafka_reply_topic=ai_reply
kafka_consumer_group=spark_push_hermes_bridge

# 本机 Pi Agent gateway；不要改成第三方模型地址，否则会绕过 Skills 和 RAG。
hermes_base_url=${SPARK_PUSH_HERMES_BASE_URL}
hermes_api_key=${SPARK_PUSH_HERMES_API_KEY}
hermes_model=${SPARK_PUSH_HERMES_MODEL}
# true 时使用 /v1/chat/completions 的 SSE 增量；false 保留完整响应兼容路径。
hermes_streaming=${SPARK_PUSH_HERMES_STREAMING}
request_timeout_ms=600000
reply_delivery_timeout_ms=5000
