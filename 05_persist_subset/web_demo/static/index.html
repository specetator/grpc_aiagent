<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>04_room_subset Web Demo</title>
  <link rel="stylesheet" href="auth_style.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f5f7fa; margin: 0; padding: 0; color: #333; }
    .wrap { max-width: 960px; margin: 40px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 18px; box-shadow: 0 6px 20px rgba(0,0,0,0.04); }
    h1 { margin: 0 0 6px; color: #1976d2; }
    .sub { color: #777; font-size: 13px; margin-bottom: 18px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    a.item { display: block; text-decoration: none; color: inherit; border: 1px solid #eee; border-radius: 10px; padding: 16px; background: #fff; }
    a.item:hover { border-color: #bbdefb; background: #f0f7ff; }
    .title { font-weight: 700; margin-bottom: 6px; }
    .desc { font-size: 13px; color: #666; line-height: 1.6; }
    code { background: #f6f8fa; padding: 1px 6px; border-radius: 6px; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>04_room_subset Web Demo</h1>
      <div class="sub">
        适配 <code>logic:9101</code> + <code>comet(ws):9000</code> 的“话题(房间)/聊天室”演示页面。
      </div>
      <div class="grid">
        <a class="item" href="single_chat.html">
          <div class="title">一对一私聊（消息中心）</div>
          <div class="desc">
            登录/注册、发起私聊、会话列表、未读数、标记已读、WebSocket 实时收发（含 10 秒心跳）。
          </div>
        </a>
        <a class="item" href="room_chat.html">
          <div class="title">房间/话题聊天室（用户端）</div>
          <div class="desc">
            登录/注册、拉取房间列表、加入/退出、查看房间成员、通过 WebSocket 发送 <code>target_type=room</code> 消息，接收推送。
          </div>
        </a>
        <a class="item" href="admin_room.html">
          <div class="title">房间管理（管理员）</div>
          <div class="desc">
            管理员登录后创建话题、查看房间成员，并可生成“分享链接”（用户端打开后自动加入对应房间）。
          </div>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
