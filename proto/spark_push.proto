syntax = "proto3";

package sparkpush;

// 通用错误信息
message ErrorInfo {
  int32 code = 1;      // 0 表示成功，非 0 代表错误码
  string message = 2;  // 具体错误原因
}

// 基础消息模型（内部存储/序列化使用）
message ChatMessage {
  string msg_id = 1;
  string session_id = 2;
  int64 msg_seq = 3;
  int64 sender_id = 4;
  int64 timestamp_ms = 5;
  string msg_type = 6;   // text / system / danmaku / ...
  string content_json = 7;
  string client_msg_id = 8;
}

// 上行请求已经被 Logic 接收，或已经被目标 Comet 排入本地连接队列。
// accepted 不代表客户端已经看到消息；delivered 也表示服务端已交给
// Comet/WebSocket 队列，客户端仍应以 msg_seq 做去重和缺口补偿。
enum AckStage {
  ACK_STAGE_UNSPECIFIED = 0;
  ACK_STAGE_ACCEPTED = 1;
  ACK_STAGE_DELIVERED = 2;
}

// 弹幕消息结构（用于时间轴拉取）
message DanmakuMessage {
  string msg_id = 1;
  string video_id = 2;
  int64 timeline_ms = 3;
  int64 sender_id = 4;
  string content_json = 5;
  int64 timestamp_ms = 6;
}

// ========== LogicService 相关 ==========

// comet -> logic：鉴权
message VerifyTokenRequest {
  string token = 1;
  string comet_id = 2;
}

message VerifyTokenReply {
  ErrorInfo error = 1;
  int64 user_id = 2;
}

// comet -> logic：上行聊天/聊天室/弹幕消息
message UpstreamMessageRequest {
  int64 from_user_id = 1;
  string client_msg_id = 2;
  string scene = 3;          // single / group / chatroom / danmaku
  int64 to_user_id = 4;      // 单聊
  int64 group_id = 5;        // 群聊/聊天室
  string video_id = 6;       // 弹幕
  int64 timeline_ms = 7;     // 弹幕时间轴
  string content_json = 8;
  string source_comet_id = 9;  // 来源 Comet，用于回传 delivered_ack
}

message UpstreamMessageReply {
  ErrorInfo error = 1;
  ChatMessage message = 2;
  AckStage ack_stage = 3;
  int64 accepted_at_ms = 4;
}

// comet -> logic：用户下线
message UserOfflineRequest {
  int64 user_id = 1;
  string comet_id = 2;
}

message SimpleReply {
  ErrorInfo error = 1;
}

// 客户端按 session_id/msg_seq 主动补齐缺口。
message SyncMessagesRequest {
  int64 user_id = 1;
  string session_id = 2;
  int64 after_seq = 3;
  int32 limit = 4;
}

message SyncMessagesReply {
  ErrorInfo error = 1;
  repeated ChatMessage messages = 2;
  bool has_more = 3;
  int64 next_seq = 4;
}

message DeliveredCursor {
  string session_id = 1;
  int64 msg_seq = 2;
}

message UserDeliveredCursor {
  int64 user_id = 1;
  string session_id = 2;
  int64 msg_seq = 3;
}

// 建立 WebSocket 后补推用户离线期间尚未交给 Comet 的消息。
message SyncOfflineRequest {
  int64 user_id = 1;
  int32 limit = 2;
}

message SyncOfflineReply {
  ErrorInfo error = 1;
  repeated ChatMessage messages = 2;
  bool has_more = 3;
}

message MarkDeliveredRequest {
  int64 user_id = 1;
  repeated DeliveredCursor cursors = 2;
  repeated UserDeliveredCursor user_cursors = 3;
}

// 房间加入/离开（聊天室/弹幕房）
message RoomReportRequest {
  int64 user_id = 1;
  int64 room_id = 2;
  string comet_id = 3;
}

// 广播请求（由 HTTP 或内部调用）
message BroadcastRequest {
  string scope = 1;          // all / group / tag ...
  int64 group_id = 2;        // 可选
  string content_json = 3;
}

message BroadcastReply {
  ErrorInfo error = 1;
  string task_id = 2;
}

// 双向流包装：Comet↔Logic 持久连接，消除逐条 Unary RPC 开销
message StreamMessage {
  string request_id = 1;
  oneof payload {
    UpstreamMessageRequest upstream = 2;
    UserOfflineRequest offline = 3;
    RoomReportRequest room_join = 4;
    RoomReportRequest room_leave = 5;
  }
}

message StreamResponse {
  string request_id = 1;
  ErrorInfo error = 2;
  oneof payload {
    UpstreamMessageReply upstream_reply = 3;
    SimpleReply simple_reply = 4;
  }
}

service LogicService {
  rpc VerifyToken(VerifyTokenRequest) returns (VerifyTokenReply);
  rpc SendUpstreamMessage(UpstreamMessageRequest) returns (UpstreamMessageReply);
  rpc UserOffline(UserOfflineRequest) returns (SimpleReply);
  rpc ReportRoomJoin(RoomReportRequest) returns (SimpleReply);
  rpc ReportRoomLeave(RoomReportRequest) returns (SimpleReply);
  rpc Broadcast(BroadcastRequest) returns (BroadcastReply);
  rpc SyncMessages(SyncMessagesRequest) returns (SyncMessagesReply);
  rpc SyncOffline(SyncOfflineRequest) returns (SyncOfflineReply);
  rpc MarkDelivered(MarkDeliveredRequest) returns (SimpleReply);
  // 双向流模式（高性能）
  rpc MessageStream(stream StreamMessage) returns (stream StreamResponse);
}

// ========== JobService / CometService 相关 ==========

// logic -> job -> comet：按 comet fanout 的下行消息目标
message FanoutTarget {
  int64 user_id = 1;
}

message PushToCometRequest {
  string comet_id = 1;
  ChatMessage message = 2;
  repeated FanoutTarget targets = 3;
  string request_id = 4;       // Job/Comet 流内幂等键
  string ack_comet_id = 5;     // delivered_ack 回传的来源 Comet
  int64 ack_user_id = 6;
  string scene = 7;            // single / group / broadcast，便于独立排队与指标
}

message PushToCometReply {
  ErrorInfo error = 1;
  string request_id = 2;
  int32 delivered_count = 3;
}

message PushDeliveryAckRequest {
  int64 user_id = 1;
  ChatMessage message = 2;
}

// Logic -> Job 的持久化事件。该事件先写入 Kafka，再由 Job 消费并幂等落库，
// 消除 Logic 进程崩溃时本地异步任务丢失的窗口。
message PersistMessageRequest {
  ChatMessage message = 1;
  string scene = 2;
  int64 user1_id = 3;
  int64 user2_id = 4;
  int64 room_id = 5;
}

message PushStreamReply {
  int64 received_count = 1;
}

// logic -> job：广播任务
message BroadcastTaskRequest {
  string task_id = 1;
  string scope = 2;
  int64 group_id = 3;
  string content_json = 4;
}

service JobService {
  rpc EnqueuePushTask(PushToCometRequest) returns (SimpleReply);
  rpc EnqueueBroadcastTask(BroadcastTaskRequest) returns (SimpleReply);
}

service CometService {
  rpc PushToComet(PushToCometRequest) returns (PushToCometReply);
  rpc PushDeliveryAck(PushDeliveryAckRequest) returns (SimpleReply);
  // Job 为每个 Comet 复用一条双向长连接；每条 request 都有对应 reply，
  // 只有收到 Comet reply 后 Job 才确认 Kafka 消息。
  rpc PushStream(stream PushToCometRequest) returns (stream PushToCometReply);
}
