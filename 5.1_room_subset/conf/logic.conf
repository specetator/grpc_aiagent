# 逻辑服务监听地址（grpc，供 comet/job 等内部服务调用）
listen_addr=0.0.0.0
listen_port=9100

# 对外 HTTP 接口端口（客户端或管理接口访问）
http_port=9101

# logic HTTP 的 muduo IO 线程数（>1 可提升并发吞吐；默认 4）
logic_http_threads=8

# Kafka 推送/广播配置
kafka_brokers=127.0.0.1:9092
kafka_push_topic=push_to_comet
kafka_broadcast_topic=broadcast_task

# Redis 连接池配置
redis_host=127.0.0.1
redis_port=6379
redis_password=
redis_db=0
redis_pool_size=64

# MySQL 连接池配置
mysql_host=localhost
mysql_port=3306
mysql_user=root
mysql_password=Lqf@123456
mysql_db=spark_push
mysql_pool_size=64

# 日志配置
# log_level 支持：TRACE/DEBUG/INFO/WARN/ERROR/FATAL（大小写不敏感）
log_level=ERROR
# log_file 为空则使用默认 logs/logic.log；建议水平部署时按端口区分
# 支持占位符：${program} ${pid} ${listen_port} ${http_port}
log_file=logs/${program}_${listen_port}.log
