# comet TCP 监听（客户端长连接，对外暴露）
listen_addr=0.0.0.0
listen_port=9000

# comet 的 gRPC 端口及 ID（供 logic/job 等内部服务调用）
comet_grpc_port=9105
comet_id=comet-1

# logic 服务 gRPC 地址（指向 logic 的 listen_port）
logic_grpc_target=127.0.0.1:9100

# comet I/O 工作线程数
comet_io_threads=8


# 日志配置
# log_level 支持：TRACE/DEBUG/INFO/WARN/ERROR/FATAL（大小写不敏感）
log_level=INFO
# log_file 为空则使用默认 logs/comet.log；推荐使用 comet_id 区分不同实例
# 支持占位符：${program} ${pid} ${comet_id} ${listen_port} ${comet_grpc_port}
log_file=logs/${program}_${comet_id}.log
