# Kafka 连接与主题
kafka_brokers=127.0.0.1:9092
kafka_push_topic=push_to_comet
kafka_broadcast_topic=broadcast_task

# 消费组（同一服务实例共享）
kafka_consumer_group=spark_push_group

# Comet 地址列表，格式 id=host:port 逗号分隔
comet_targets=comet-1=127.0.0.1:9105

# 日志配置
# log_level 支持：TRACE/DEBUG/INFO/WARN/ERROR/FATAL（大小写不敏感）
log_level=INFO
# log_file 为空则使用默认 logs/job.log；job 常水平扩容，推荐带上 consumer_group 和 pid
# 支持占位符：${program} ${pid} ${kafka_consumer_group}
log_file=logs/${program}_${kafka_consumer_group}_${pid}.log


