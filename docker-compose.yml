name: sparkpush

x-application: &application
  image: ${SPARK_PUSH_IMAGE:-ghcr.io/specetator/spark-push:v0.1.0}
  build:
    context: .
    args:
      BUILD_JOBS: ${SPARK_PUSH_BUILD_JOBS:-2}
  restart: unless-stopped
  init: true
  stop_grace_period: 40s
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs:
    - /tmp
    - /app/logs:uid=10001,gid=10001,mode=0750
  volumes:
    - spark_security:/run/spark-secrets:ro
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  bootstrap:
    <<: *application
    user: root
    command: [bootstrap]
    restart: "no"
    environment:
      SPARK_PUSH_MYSQL_PASSWORD: ${SPARK_PUSH_MYSQL_PASSWORD:-}
    volumes:
      - spark_security:/run/spark-secrets
      - spark_admin:/run/spark-admin
      - spark_attachments:/app/data/attachments

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/spark-admin/mysql-root-password
      MYSQL_ROOT_HOST: "%"
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    volumes:
      - spark_mysql_data:/var/lib/mysql
      - spark_admin:/run/spark-admin:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$(cat /run/spark-admin/mysql-root-password)" mysql --protocol=TCP -h127.0.0.1 -uroot -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec]
    volumes:
      - spark_redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    volumes:
      - spark_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:29092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka: {condition: service_healthy}
    restart: "no"
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        for topic in push_single push_group push_to_comet broadcast_task persist_message ai_request ai_delta ai_reply ai_request.dlq ai_reply.dlq persist_message.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done

  migrate:
    <<: *application
    command: [migrate]
    restart: "no"
    volumes:
      - spark_security:/run/spark-secrets:ro
      - spark_admin:/run/spark-admin:ro
    environment:
      SPARK_LEGACY_KAFKA_DRAINED: ${SPARK_LEGACY_KAFKA_DRAINED:-false}
    depends_on:
      mysql: {condition: service_healthy}

  logic:
    <<: *application
    command: [logic]
    environment:
      SPARK_PUSH_ADMIN_ACCOUNT: ${SPARK_PUSH_ADMIN_ACCOUNT:-}
      SPARK_PUSH_ADMIN_PASSWORD: ${SPARK_PUSH_ADMIN_PASSWORD:-}
      SPARK_PUSH_HERMES_ENABLED: ${SPARK_PUSH_HERMES_ENABLED:-false}
      SPARK_PUSH_ROOM_AGENT_ENABLED: "false"
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    volumes:
      - spark_security:/run/spark-secrets:ro
      - spark_attachments:/app/data/attachments
    healthcheck:
      test: [CMD, python3, /app/deploy/health.py, logic]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 15s

  comet:
    <<: *application
    command: [comet]
    depends_on:
      logic: {condition: service_healthy}
    healthcheck:
      test: [CMD, python3, /app/deploy/health.py, comet]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 10s

  job:
    <<: *application
    command: [job]
    depends_on:
      comet: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      kafka-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python3, /app/deploy/health.py, job]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 10s

  web:
    <<: *application
    command: [web]
    volumes: []
    healthcheck:
      test: [CMD, python3, /app/deploy/health.py, web]
      interval: 5s
      timeout: 4s
      retries: 10

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${SPARK_PUSH_BIND:-0.0.0.0}:${SPARK_PUSH_PORT:-9010}:9010"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web: {condition: service_healthy}
      logic: {condition: service_healthy}
      comet: {condition: service_healthy}
      job: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9010/health]
      interval: 10s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  agent-bridge:
    <<: *application
    profiles: [agents]
    command: [hermes_bridge]
    environment:
      SPARK_PUSH_HERMES_BASE_URL: ${SPARK_PUSH_AGENT_GATEWAY_URL:-http://host.docker.internal:8643/v1}
      SPARK_PUSH_HERMES_API_KEY: ${SPARK_PUSH_HERMES_API_KEY:-}
      SPARK_PUSH_HERMES_MODEL: ${SPARK_PUSH_HERMES_MODEL:-kernel-agent}
      SPARK_PUSH_HERMES_STREAMING: "true"
    extra_hosts: [host.docker.internal:host-gateway]
    depends_on:
      kafka-init: {condition: service_completed_successfully}

volumes:
  spark_admin:
  spark_security:
  spark_mysql_data:
  spark_redis_data:
  spark_kafka_data:
  spark_attachments:
